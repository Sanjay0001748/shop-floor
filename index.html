/* ---------- deeper explanation, worked example, common mistake ---------- */
const X={
"safety-loto":["Shock severity depends on how much current passes through the body, the path it takes and for how long. A path across the chest is the dangerous one, so never let your body bridge two points. The second hazard is arc flash: a short circuit inside a panel releases intense heat and light, which is why panel doors stay closed and only authorised people operate large breakers.","Job: change a conveyor roller. Stop the conveyor at the operator station. Open isolator Q1 at the MCC. Fit your padlock and tag. Press START at the machine to confirm nothing moves. Test for voltage at the motor terminals with a proven meter. Only then begin.","Using the emergency stop or a control switch as isolation. Those only interrupt the control circuit. The power circuit is still connected, and a fault or another person can re-energise it."],
"what-is-electricity":["Individual electrons drift slowly, a fraction of a millimetre each second. The effect is fast because the wire is already full of electrons: push one in at one end and one moves out at the other almost at once, like a pipe full of marbles. By convention, drawings show current flowing from positive to negative, which is opposite to the electrons' real drift. Everyone uses the conventional direction.","A torch: cell (source), metal strip (conductor), switch, bulb (load), spring back to the cell. Slide the switch off and you open one gap. The bulb goes out even though the cell is still full of energy.","Thinking one wire to a load is enough. Current needs a way out and a way back. One wire with no return is an open circuit and nothing flows."],
"voltage-current-resistance":["Resistance depends on the material, the length and the thickness of a conductor. A long thin cable has more resistance than a short thick one, so it loses more voltage along the way and runs hotter for the same current. That is why cable sizes go up with current and with distance. Voltage is always measured between two points. A single point has no voltage by itself.","A 24 V indicator lamp has a resistance of 480 Ω. I = V ÷ R = 24 ÷ 480 = 0.05 A, which is 50 mA. If the supply sags to 20 V, the current falls to 20 ÷ 480 = 42 mA and the lamp is dimmer.","Mixing up units. 50 mA is 0.05 A and 4.7 kΩ is 4700 Ω. Convert everything to volts, amps and ohms before using the formula."],
"series-and-parallel":["Two rules solve any circuit. Round a series loop, the voltages across the parts add up to the supply voltage. At any junction, the current flowing in equals the current flowing out. These are Kirchhoff's laws, and together with Ohm's law they are all you need for DC circuits.","24 V across 20 Ω and 30 Ω. In series: R = 50 Ω, I = 0.48 A, and the voltages are 9.6 V and 14.4 V. In parallel: the currents are 1.2 A and 0.8 A, total 2.0 A, so the combined resistance is 24 ÷ 2 = 12 Ω.","Assuming more resistors always means more resistance. Adding a resistor in parallel always lowers the total, because it opens another path."],
"power-and-energy":["In a resistor all the power turns into heat: P = I² × R. Double the current and the heating is four times as much. This is why a loose or corroded joint, which has extra resistance, gets hot and eventually burns. For a three-phase motor, electrical power in is √3 × V × I × PF. The kW on the nameplate is the mechanical power out at the shaft, which is a little less because no motor is 100% efficient.","A motor draws 60 kW from the supply for 20 hours a day. Energy = 60 × 20 = 1200 kWh a day. At ₹8 a unit that is ₹9600 a day. Cutting idle running by 2 hours saves 120 kWh, or ₹960, every day.","Saying a machine uses '75 kW per hour'. kW is already a rate. The machine uses 75 kWh in each hour it runs at that load."],
"ac-and-dc":["An AC voltage is always changing, so we quote its RMS value: the DC voltage that would give the same heating. A 230 V supply actually peaks at about 325 V (230 × √2). Meters read RMS. DC is made from AC by a rectifier, and that is the job of the 24 V power supply unit in every control panel.","Frequency 50 Hz means one cycle takes 1 ÷ 50 = 0.02 s, or 20 ms. The voltage passes through zero twice in each cycle, so 100 times a second.","Using the DC range of a meter on an AC circuit, or the other way round. The reading is close to zero and you may wrongly decide the circuit is dead."],
"magnetism-and-induction":["The induced voltage always acts to oppose the change that caused it. This is Lenz's law. Push a magnet into a coil and the coil pushes back. It is why a coil resists any change in its current, a property called inductance. It also explains the voltage spike when a contactor coil is switched off: the collapsing field tries to keep the current going. Suppressors fitted across coils absorb that spike.","A coil of 200 turns gives a certain voltage when a magnet passes. With 400 turns at the same speed the voltage doubles. Pass the magnet twice as fast and it doubles again.","Expecting a voltage from a strong magnet that is not moving. Strength alone does nothing. Only change induces."],
"three-phase":["Loads can be connected in star (Y) or delta (Δ). In star, one end of each winding joins a common point and each winding sees the phase voltage, 240 V. In delta the windings form a triangle and each sees the full line voltage, 415 V. When the three currents are equal they cancel at the star point and the neutral carries nothing. Unequal single-phase loads leave a current in the neutral.","A motor draws 100 A at 415 V with a power factor of 0.85. P = √3 × 415 × 100 × 0.85 = 61 100 W, so about 61 kW of electrical input.","Measuring 240 V on one phase and deciding the supply is healthy. A motor needs all three. Check R-Y, Y-B and B-R. Each should read about 415 V."],
"power-factor":["In a motor the current wave lags behind the voltage wave, because the windings are coils. Power factor is the cosine of that lag angle. A capacitor does the opposite: its current leads. Put a capacitor beside a motor and the reactive current passes back and forth between the two instead of travelling from the supply. Lightly loaded motors have the worst power factor, because the magnetising current stays the same while the working current falls.","400 kW at a power factor of 0.75 needs 533 kVA and carries 353 kVAr. To reach 0.95 the kVAr must fall to 131. Capacitors needed: 353 − 131 = about 220 kVAr. The current at 415 V falls from 742 A to 586 A.","Thinking capacitors reduce the kW a machine uses. They do not. They reduce the current and kVA drawn from the supply, which cuts losses and penalties."],
"transformers":["A transformer is rated in kVA, not kW, because its heating depends on voltage and current whatever the power factor of the load. It has two kinds of loss. Core loss is there whenever it is energised. Copper loss rises with the square of the load current. In oil-filled transformers the oil both insulates and cools. A tap changer adjusts the turns ratio slightly to correct the output voltage.","A 1000 kVA, 11 kV / 433 V transformer. Full-load secondary current = 1 000 000 ÷ (√3 × 433) = 1333 A. Primary current = 1 000 000 ÷ (√3 × 11 000) = about 52 A.","Treating the low-voltage side as the safe side. It carries the higher current and a far larger fault current."],
"induction-motors":["Torque comes from slip. At no load the slip is tiny and the motor draws mainly magnetising current. As the load rises the rotor slows a little, more current is induced, and the torque rises to match. Push past the maximum torque and the motor stalls and draws starting current. The nameplate also tells you the connection: '415 V Δ' means the windings are made for 415 V each and must be linked in delta on a 415 V supply.","Nameplate: 1470 rpm, 50 Hz. The nearest synchronous speed above that is 1500 rpm, so it is a 4-pole motor. Slip = (1500 − 1470) ÷ 1500 = 2%.","Judging the load by sound or touch. Measure the current in all three phases and compare with the nameplate. Unequal phase currents are a warning in themselves."],
"motor-starters":["Why is starting current so high? At standstill the slip is 100%, so the rotor behaves like the short-circuited secondary of a transformer. As the motor gathers speed the current falls. In a star-delta starter the changeover must happen when the motor is near full speed. To use star-delta, a motor must have all six winding ends brought out and be rated for delta at the supply voltage.","A 75 kW motor with a full load current of 140 A. DOL start: about 6 × 140 = 840 A. Star-delta start: about 840 ÷ 3 = 280 A. Starting torque also falls to one third.","Setting the star-delta timer too short. The motor is still slow at changeover, the current surge returns and the breaker may trip."],
"vfd":["A drive keeps the ratio of voltage to frequency constant. At 25 Hz it gives about half the voltage, so the magnetic field in the motor stays the same and full torque is available. Above 50 Hz the voltage cannot rise any further, so torque falls. The output is a rapid train of pulses, not a smooth wave, and the motor windings smooth it into a near-sine current. At very low speed the motor's own fan cools poorly, so some motors have a separate cooling fan.","A 4-pole motor at 35 Hz: field speed = 120 × 35 ÷ 4 = 1050 rpm. Output voltage is about 415 × 35 ÷ 50 = 290 V. A fan at this speed needs 0.7 × 0.7 × 0.7 = 34% of full power.","Opening a contactor or isolator between the drive and the motor while it is running. That can damage the drive. Stop the drive first."],
"breakers-and-fuses":["Protection is graded so that the device nearest the fault trips first and the rest of the plant keeps running. This is called discrimination. Every breaker also has a breaking capacity in kA, the largest fault current it can safely interrupt. Close to a big transformer the fault current is very high, so the kA rating matters as much as the amp rating. The overload relay is set to the motor's full load current.","A motor with a full load current of 28 A: set the overload relay to 28 A. Choose a breaker or fuse above that which lets the starting current of about 170 A pass for a few seconds but opens instantly on a short circuit.","Fitting a bigger fuse or breaker because the old one 'keeps tripping'. The cable is now unprotected and becomes the fuse."],
"contactors-and-control":["Contactor terminals follow a standard. The main contacts are 1-2, 3-4 and 5-6. The coil is A1-A2. An auxiliary contact numbered 13-14 is normally open and one numbered 21-22 is normally closed. To run a motor in both directions, two contactors swap two phases, and each one's NC auxiliary contact is wired into the other's coil circuit. That interlock stops both closing together and short-circuiting the supply.","Follow the diagram. Press S1: current flows L, S0, F1, S1, coil K1, N. K1 closes its 13-14 contact. Release S1: the current now flows through 13-14 instead. Press S0: the path opens, K1 drops, 13-14 opens and the circuit is back at rest.","Confusing the coil voltage with the motor voltage. A contactor switching a 415 V motor may have a 24 V DC, 110 V AC or 230 V AC coil. Read the coil label before you replace one."],
"earthing":["For the breaker to trip quickly the fault current must be large, and that needs a low resistance all the way round the earth loop. A loose or corroded earth joint can leave a body at a dangerous voltage without tripping anything, which is why earth continuity and earth pit resistance are tested on a schedule. A residual current device adds a second layer: it compares the current going out with the current coming back and trips if a little is leaking to earth.","Phase-to-earth voltage 240 V, earth loop resistance 0.5 Ω. Fault current = 240 ÷ 0.5 = 480 A, enough to trip a 32 A breaker at once. A bad joint adding 10 Ω cuts that to 23 A, and the breaker may never trip.","Using the neutral as an earth, or linking the two at a machine. A broken neutral would then make every metal body live."],
"plc-and-sensors":["Signals come in two kinds. A digital signal is on or off: a proximity switch, a push-button. An analog signal varies, most often as 4 to 20 mA, where 4 mA is the bottom of the range and 20 mA the top. Starting at 4 mA instead of zero means a broken wire, which gives 0 mA, shows up as a fault. Three-wire sensors are PNP or NPN. A PNP sensor switches +24 V to the input.","A pressure transmitter is ranged 0 to 10 bar for 4 to 20 mA and its signal is 12 mA. That is (12 − 4) ÷ 16 = 50% of the range, so the pressure is 5 bar.","Blaming the PLC program first. Programs rarely change by themselves. Check the field device, its wiring and the input LED before suspecting the logic."],
"reading-drawings":["Drawings use a page and column grid. A cross-reference such as /12.4 beside a contact means its coil is on page 12, column 4. Under each coil there is usually a small table listing where its contacts are used. A wire keeps the same number until it passes through a device. Terminal strips are tagged X1, X2 and so on, and that is where the field cables land.","The motor will not start and K1 is not pulling in. The drawing shows K1's coil fed through S0, F1 and S1. With a technician, and the circuit live, measure the voltage after each device in turn. The device where the voltage disappears is the open point.","Reading a contact as it looks in a running machine. The drawing shows everything with the power off and nothing pressed."],
"multimeter":["A voltmeter has a very high internal resistance, so connecting it across a circuit draws almost nothing. An ammeter has almost none, so it must go in series. Put across a supply it is a short circuit. That is why the current sockets on a meter are fused, and why plant work uses a clamp meter. Insulation resistance needs a separate tester that works at 500 V or 1000 V, because a multimeter's small test voltage cannot stress the insulation.","Checking a control fuse on a live 24 V circuit: measure from 0 V to the supply side of the fuse and read 24 V. Measure from 0 V to the load side and read 0 V. The fuse is open. Isolate, then confirm with the continuity range.","Leaving the red lead in the amps socket and then measuring voltage. The meter becomes a short circuit across the supply. Check the lead positions every single time."],
"fault-finding":["On a long chain the fastest method is half-splitting: measure in the middle. If the signal is there, the fault is downstream. If not, it is upstream. Each measurement halves the search. Separate two questions early: is the power there, and is the command there? A motor that hums but does not turn has power on only some phases or is jammed. That is a power or mechanical fault, not a control fault.","A motor does not run. The contactor pulls in when START is pressed, so the control circuit is fine. At the contactor output you measure 415 V on R-Y and 0 V on Y-B. One pole is not passing: a blown fuse or a burnt contact on the B phase.","Changing several things at once. If the machine then runs you do not know what fixed it, and the real cause may still be there."]};

Object.assign(X,{
"capacitors-and-inductors":["Why the time shift? A capacitor's current is largest when its voltage is changing fastest, which is as the voltage passes through zero. So its current peaks a quarter of a cycle before the voltage. An inductor's voltage is largest when its current is changing fastest, so its current peaks a quarter of a cycle after. Because the two are opposite, one can cancel the other, and that is power factor correction. At one particular frequency XL equals XC. This is resonance, and it causes trouble when capacitor banks meet harmonics.","A 100 mH coil at 50 Hz: XL = 2 × 3.14 × 50 × 0.1 = 31.4 Ω. A 100 µF capacitor at 50 Hz: XC = 1 ÷ (2 × 3.14 × 50 × 0.0001) = 31.8 Ω.","Measuring a coil's resistance with a multimeter and using it to predict the AC current. On AC the coil's reactance adds to its resistance, so the real current is much lower."],
"other-motors-and-generators":["A servo system is a closed loop. The drive compares where the axis is, from the encoder, with where it should be, thousands of times a second, and corrects the difference. That gives repeatable positioning. A generator running alone must match the load moment by moment. When load rises the engine slows slightly, the governor adds fuel to restore 50 Hz, and the AVR raises the field current to restore voltage. To connect a generator to a live busbar, its voltage, frequency and phase must match first. That is synchronising.","A DG alternator has 4 poles. For 50 Hz it must turn at 120 × 50 ÷ 4 = 1500 rpm. If a sudden load pulls the engine down to 1470 rpm, the frequency dips to 4 × 1470 ÷ 120 = 49 Hz until the governor recovers.","Replacing a servo motor without setting up its encoder and parameters. The drive must know the motor and its feedback, or it will fault."],
"power-electronics":["Electronic switches are efficient because they are either fully on, with almost no voltage across them, or fully off, with no current through them. Either way little power is lost in the switch. The losses come in the brief moments of switching and appear as heat, which is why drives have heatsinks and fans. Fast switching also makes the supply current flow in pulses. Those distortions are harmonics, covered in the power quality lesson.","A single-phase bridge rectifier on 230 V with a smoothing capacitor charges to the peak: 230 × √2 = about 325 V DC. A drive on a 415 V three-phase supply has a DC bus of roughly 415 × 1.35 = 560 V.","Assuming a drive or UPS is dead because its display is off. The DC bus capacitors stay charged for minutes. Wait the stated time, then measure the DC bus."],
"plant-power-distribution":["Why step down in stages? For the same power, a higher voltage means a lower current, and the loss in a cable depends on the square of the current. So power travels at high voltage as far as possible and is stepped down close to where it is used. Grid and DG incomers are interlocked so that both cannot feed one busbar unless they are deliberately synchronised.","1000 kW at a power factor of 0.95. At 433 V the current is 1 000 000 ÷ (√3 × 433 × 0.95) = about 1400 A. At 11 kV it is about 55 A. The same power needs one twenty-fifth of the current.","Assuming a board is dead because the grid is off. The DG or a UPS may be feeding it from another direction. Always test."],
"cables-and-terminations":["A joint is a resistance, and the heat it makes is I² × R. A slightly loose terminal has a little extra resistance. At high current that makes heat, heat oxidises the surfaces, the resistance rises further, and the joint runs away until it burns. This is why terminals are tightened to a stated torque and panels are scanned with a thermal camera. Aluminium needs extra care: it creeps under pressure and oxidises quickly, so it needs the correct lugs and jointing compound.","A motor draws 100 A through 150 m of 35 sq mm copper cable, about 0.52 Ω per km. Drop = √3 × 100 × 0.52 × 0.15 = 13.5 V, which is 3.3% of 415 V.","Choosing a cable by full load current alone. Also check voltage drop on long runs, derating for grouping and heat, and whether the cable survives the fault current until the breaker opens."],
"switchgear-and-protection-relays":["Overcurrent relays commonly use an inverse-time curve: the larger the fault current, the faster the trip. A modest overload is tolerated for seconds and a heavy fault is cleared in a fraction of a second. Upstream relays are set a little slower than downstream ones so that only the nearest breaker opens. A CT acts as a current source and drives its secondary current through whatever is connected. If the secondary is open while the primary carries current, the voltage rises to a dangerous level. So CT secondaries are shorted before any meter or relay is removed.","A feeder has an 800/5 CT and carries 480 A. Relay current = 480 × 5 ÷ 800 = 3 A. If the relay is set to pick up at 5 A, it starts timing when the feeder current passes 800 A.","Resetting a tripped relay to get power back before recording what it showed. The indication is the only evidence of the kind of fault and the phase it was on."],
"power-quality":["A drive's rectifier draws current only near the peaks of the voltage wave, in short pulses. Any repeating waveform can be built from a 50 Hz sine wave plus sine waves at multiples of 50 Hz. Those multiples are the harmonics. Common drives produce mainly the 5th, 7th, 11th and 13th. Capacitors oppose high frequencies less, so they attract harmonic current and overheat, and together with the supply's inductance they can resonate. A reactor in series with each capacitor step, called a detuned bank, prevents that.","Phase voltages are 410, 415 and 402 V. The average is 409 V and the largest deviation is 7 V. Unbalance = 7 ÷ 409 = 1.7%, enough to give clearly uneven motor currents and extra heating.","Adding plain capacitor banks to a plant full of drives. Without detuning reactors the capacitors can resonate with the supply and fail early."],
"machine-safety-circuits":["The principle is fail-safe design with redundancy and monitoring. Redundancy means two channels and two contactors, so a single fault cannot remove the protection. Monitoring means the relay checks for faults on every cycle, so a hidden fault is found before a second one adds to it. Standards grade how reliable a safety function must be, as a Performance Level (PL a to e) or a Safety Integrity Level (SIL), based on how severe and how likely an injury is. An emergency stop is not isolation. After stopping, the machine still needs lockout before anyone works on it.","An operator opens a guard. Both channels of the guard switch open and the safety relay drops K1 and K2. K1's contacts have welded, but K2 opens and the motor stops. On reset, the relay sees through its feedback loop that K1 has not opened and refuses to restart. The fault has been found safely.","Bridging a guard switch to keep production running. It removes the protection for everyone who uses the machine after you."],
"instrumentation-and-control-loops":["Current is used for signals because it is the same everywhere in a series loop, so cable length and resistance do not change the reading, and it resists electrical noise better than a voltage signal. Tuning a PID loop is a balance. With too little gain the loop is sluggish. With too much it overshoots and oscillates. Calibration means comparing an instrument with a known reference and adjusting it. It is done on a schedule because every sensor drifts.","An RTD transmitter is ranged 0 to 200 °C and sends 13.6 mA. Value = (13.6 − 4) ÷ 16 × 200 = 120 °C.","Retuning the PID when the real problem is mechanical. Check for a sticking valve, a blocked sensor pocket or a failed steam trap before touching the tuning."],
"hmi-scada-and-networks":["Older fieldbuses such as Modbus RTU and Profibus use a twisted pair wired from device to device in a line, with a terminating resistor at each end. A missing terminator or a damaged shield causes intermittent faults that are hard to find. Ethernet-based networks such as Profinet, EtherNet/IP and Modbus TCP use switches and standard connectors, and are faster and easier to diagnose. Because these networks now link to office systems, security matters too.","A line stops with 'Station 7 bus fault'. Check in order: does station 7 have 24 V? Are its network LEDs on? Is the connector seated and the terminator switch right? Was anything replaced recently that might have the wrong address?","Plugging a personal laptop or USB drive into a machine network. That is how malware reaches plant controls."],
"maintenance-and-testing":["Insulation ages with heat. A common rule of thumb is that every 10 °C above the rated temperature halves the insulation's life, so a clogged fan cover quietly shortens a motor's life. Insulation classes B, F and H state the temperature a winding can stand. An insulation resistance reading means most as a trend. One value says little, but a steady fall over months is a clear warning.","A winding reads 200 MΩ after 1 minute and 500 MΩ after 10 minutes. PI = 500 ÷ 200 = 2.5. A value of 2 or more is generally taken as healthy and dry. A value near 1 suggests moisture or contamination.","Over-greasing bearings. Too much grease overheats the bearing and can be forced into the windings."],
"energy-and-efficiency":["A motor is most efficient at around 75 to 100% of its rated load. A lightly loaded motor runs at poor efficiency and poor power factor, so an oversized motor wastes energy every hour. Staggering the start of large machines keeps the demand peak down. An energy audit follows a simple order: measure, find the biggest users, remove waste such as idle running and leaks, then improve efficiency, and only then invest in new equipment. Always measure again afterwards to prove the saving.","A 75 kW motor at full load for 6000 hours a year. Old efficiency 91%, new 95%. Input falls from 75 ÷ 0.91 = 82.4 kW to 75 ÷ 0.95 = 78.9 kW. That saves about 3.5 kW, or 20 800 kWh a year: about ₹1.7 lakh at ₹8 a unit.","Fitting a drive to save energy on a load that always runs at full speed. The drive adds a few percent of loss and saves nothing."],
"standards-and-permits":["The order of controls matters. Removing the hazard altogether is best. Isolating it is next. Engineering controls such as guards and interlocks follow, then procedures such as permits, and PPE comes last because it only limits injury once everything else has failed. Authorisation is formal too: only named, trained people may switch HT equipment or issue permits. As a trainee you observe and assist until your plant authorises you. Ask which regulations and standards your plant's procedures are based on, and read the procedures themselves.","Job: clean an HT transformer. The permit lists: HT breaker opened and racked out, earths applied on both sides, locks and tags fitted, voltage tested, area barricaded. Issuer and receiver both sign. When the job ends the receiver signs it back, the earths are removed, and only then is the breaker returned to service.","Treating a permit as paperwork to fill in afterwards. Its value is in the checks made before the work starts."]});

/* hands-on animations */
function circuit(el){
  el.innerHTML='<canvas id="ciC" class="tall" aria-label="A simple circuit with a battery, a switch and a lamp"></canvas><div class="btns"><button class="btn primary" id="ciB"></button></div><p class="note" id="ciN"></p>';
  const c=$("#ciC");let on=false,off=0;
  const draw=()=>{const{x,w,h}=canvasSetup(c);x.clearRect(0,0,w,h);
    const x0=40,y0=34,rw=w-80,rh=h-64,P=2*(rw+rh),sx=x0+rw/2-22,ex=x0+rw/2+22,by=y0+rh/2,lx=x0+rw;
    const pt=d=>{d=((d%P)+P)%P;if(d<rw)return[x0+d,y0];d-=rw;if(d<rh)return[x0+rw,y0+d];d-=rh;if(d<rw)return[x0+rw-d,y0+rh];d-=rw;return[x0,y0+rh-d];};
    x.lineWidth=4;x.lineJoin="round";x.lineCap="round";x.strokeStyle=css("--ink");
    x.beginPath();x.moveTo(sx,y0);x.lineTo(x0,y0);x.lineTo(x0,y0+rh);x.lineTo(x0+rw,y0+rh);x.lineTo(x0+rw,y0);x.lineTo(ex,y0);x.stroke();
    x.beginPath();x.moveTo(sx,y0);if(on)x.lineTo(ex,y0);else x.lineTo(ex-8,y0-22);x.stroke();
    x.fillStyle=css("--accent");
    for(let k=0;k<26;k++){const q=pt(off+k*P/26);if(!on&&q[1]===y0&&q[0]>sx-4&&q[0]<ex+4)continue;x.beginPath();x.arc(q[0],q[1],4,0,7);x.fill();}
    x.fillStyle=css("--ink");[sx,ex].forEach(a=>{x.beginPath();x.arc(a,y0,5,0,7);x.fill();});
    x.fillStyle=css("--surface");x.fillRect(x0-16,by-11,32,22);
    x.beginPath();x.moveTo(x0-16,by-8);x.lineTo(x0+16,by-8);x.stroke();x.lineWidth=7;x.beginPath();x.moveTo(x0-9,by+8);x.lineTo(x0+9,by+8);x.stroke();x.lineWidth=4;
    x.beginPath();x.arc(lx,by,18,0,7);x.fillStyle=on?css("--hl"):css("--surface");x.fill();x.stroke();
    if(on){x.strokeStyle=css("--warn");x.lineWidth=2;for(let k=0;k<8;k++){const a=k*Math.PI/4;x.beginPath();x.moveTo(lx+Math.cos(a)*24,by+Math.sin(a)*24);x.lineTo(lx+Math.cos(a)*32,by+Math.sin(a)*32);x.stroke();}}
    x.fillStyle=css("--muted");x.font="13px sans-serif";x.textAlign="left";x.fillText("battery",x0+24,by+4);x.textAlign="right";x.fillText("lamp",lx-40,by+4);x.textAlign="center";x.fillText("switch",x0+rw/2,y0+24);
    if(on)off+=1.6;
    if(!reduce)raf=requestAnimationFrame(draw);};
  const upd=()=>{$("#ciB").textContent=on?"Open the switch":"Close the switch";set("ciN",on?"The loop is complete. Electrons drift round it and the lamp lights.":"The loop is broken. Nothing flows anywhere, not even next to the battery.");if(reduce)draw();};
  $("#ciB").onclick=()=>{on=!on;upd();};upd();if(!reduce)draw();
}
W.elec=function(el){el.innerHTML='<div id="elA" style="display:flex;flex-direction:column;gap:12px"></div><div id="elB" style="display:flex;flex-direction:column;gap:12px"></div>';circuit($("#elA"));W.sorter($("#elB"));};
W.ohm2=function(el){
  el.innerHTML='<canvas id="ofC" aria-label="Dots flowing through a pipe that narrows as resistance rises"></canvas><div id="ofI" style="display:flex;flex-direction:column;gap:14px"></div><p class="note">The dots are the current. Raise the voltage and they speed up. Raise the resistance and the pipe narrows and they slow down.</p>';
  W.ohm($("#ofI"));
  const c=$("#ofC"),ps=Array.from({length:46},()=>({u:Math.random(),l:Math.random()*2-1}));
  const draw=()=>{const{x,w,h}=canvasSetup(c);x.clearRect(0,0,w,h);const v=val("oV"),r=val("oR"),i=v/r,full=h*0.36,nar=full-(r/100)*(full-9);
    const hh=px=>{let t=Math.min(1,Math.abs(px-w/2)/(w*0.22));t=t*t*(3-2*t);return nar+(full-nar)*t;};
    x.strokeStyle=css("--ink");x.lineWidth=3;[1,-1].forEach(sg=>{x.beginPath();for(let px=0;px<=w;px+=4){const y=h/2+sg*hh(px);if(px)x.lineTo(px,y);else x.moveTo(px,y);}x.stroke();});
    x.fillStyle=css("--accent");const sp=Math.min(9,0.3+i*1.1)/w;
    ps.forEach(p=>{if(!reduce){p.u+=sp;if(p.u>1)p.u-=1;}const px=p.u*w;x.beginPath();x.arc(px,h/2+p.l*(hh(px)-6),3.5,0,7);x.fill();});
    if(!reduce)raf=requestAnimationFrame(draw);};
  draw();if(reduce)el.addEventListener("input",draw);
};
W.induce=function(el){
  el.innerHTML='<canvas id="inC" class="tall drag" tabindex="0" aria-label="Drag the magnet through the coil"></canvas><div class="ctrls">'+sl("inT","Turns on the coil",10,500,10,200)+'</div><div class="outs">'+out("inV","Voltage right now (relative)")+out("inP","Highest so far")+'</div><p class="note">Drag the magnet through the coil, fast and then slowly. Then hold it still inside the coil and watch the needle. The left and right arrow keys also move it.</p>';
  const c=$("#inC");let mx=60,prev=60,sig=0,peak=0,drag=false;
  const lim=v=>Math.max(40,Math.min(c.clientWidth-40,v));
  const pos=e=>{mx=lim(e.clientX-c.getBoundingClientRect().left);};
  c.onpointerdown=e=>{drag=true;try{c.setPointerCapture(e.pointerId);}catch(_){}pos(e);};
  c.onpointermove=e=>{if(drag)pos(e);};c.onpointerup=c.onpointercancel=()=>{drag=false;};
  c.onkeydown=e=>{if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();mx=lim(mx+(e.key==="ArrowRight"?24:-24));}};
  const tv=()=>set("inTv",val("inT"));$("#inT").oninput=tv;tv();
  const draw=()=>{const{x,w,h}=canvasSetup(c),cx=w/2,cy=h*0.66,t=val("inT");
    const vel=mx-prev;prev=mx;const near=Math.exp(-Math.pow((mx-cx)/(w*0.2),2));sig+=(vel*near*t/200-sig)*0.25;if(Math.abs(sig)<0.01)sig=0;peak=Math.max(peak,Math.abs(sig));
    x.clearRect(0,0,w,h);
    const gx=cx,gy=h*0.3,R=h*0.22;x.lineWidth=3;x.strokeStyle=css("--line");x.beginPath();x.arc(gx,gy,R,Math.PI,2*Math.PI);x.stroke();
    const a=-Math.PI/2+Math.max(-1.3,Math.min(1.3,sig/6));x.strokeStyle=css("--bad");x.beginPath();x.moveTo(gx,gy);x.lineTo(gx+Math.cos(a)*R*0.9,gy+Math.sin(a)*R*0.9);x.stroke();
    x.fillStyle=css("--muted");x.font="13px sans-serif";x.textAlign="center";x.fillText("0",gx,gy-R-5);x.fillText("−",gx-R-10,gy+4);x.fillText("+",gx+R+10,gy+4);
    x.strokeStyle=css("--warn");const n=Math.round(4+t/50);for(let k=0;k<n;k++){x.beginPath();x.ellipse(cx-50+k*100/(n-1),cy,9,32,0,0,7);x.stroke();}
    x.fillStyle=css("--ph-r");x.fillRect(mx-36,cy-14,36,28);x.fillStyle=css("--ph-b");x.fillRect(mx,cy-14,36,28);x.fillStyle="#fff";x.font="bold 14px sans-serif";x.fillText("N",mx-18,cy+5);x.fillText("S",mx+18,cy+5);
    set("inV",fmt(Math.abs(sig)*10));set("inP",fmt(peak*10));
    raf=requestAnimationFrame(draw);};
  draw();
};

W.react=function(el){
  el.innerHTML='<div class="ctrls">'+sl("rxF","Frequency",10,400,10,50)+sl("rxL","Inductor",1,500,1,100)+sl("rxC","Capacitor",1,500,1,100)+'</div><div class="outs">'+out("rxXL","Inductive reactance XL")+out("rxXC","Capacitive reactance XC")+'</div><p class="note" id="rxN"></p>';
  bind(el,()=>{const f=val("rxF"),l=val("rxL")/1000,c=val("rxC")/1e6,xl=2*Math.PI*f*l,xc=1/(2*Math.PI*f*c);set("rxFv",f+" Hz");set("rxLv",val("rxL")+" mH");set("rxCv",val("rxC")+" µF");set("rxXL",fmt(xl,1)+" Ω");set("rxXC",fmt(xc,1)+" Ω");
    set("rxN",Math.abs(xl-xc)<0.08*xl?"XL and XC are almost equal. This is resonance.":"Slide the frequency up: the inductor opposes more, the capacitor less.");});

W.rect=function(el){
  el.innerHTML='<div class="btns"><button class="btn" id="rcA" aria-pressed="true">Half-wave (1 diode)</button><button class="btn" id="rcB" aria-pressed="false">Full-wave (4 diodes)</button><button class="btn" id="rcC" aria-pressed="false">Full-wave with capacitor</button></div><canvas id="rcV" aria-label="Rectifier output waveform"></canvas><p class="note" id="rcN"></p>';
  let m=0;const c=$("#rcV"),txt=["One diode passes only the positive half of each cycle. Half the wave is thrown away.","Four diodes in a bridge flip the negative halves upward. The output never reverses but it still pulses.","A capacitor fills the gaps between peaks. The result is nearly steady DC: this is what a power supply and a drive's DC bus do."];
  const draw=()=>{const{x,w,h}=canvasSetup(c);x.clearRect(0,0,w,h);const mid=h/2,A=h*0.36,ph=px=>px/w*Math.PI*6;
    x.strokeStyle=css("--line");x.lineWidth=1;x.beginPath();x.moveTo(0,mid);x.lineTo(w,mid);x.stroke();
    x.lineWidth=1.5;x.beginPath();for(let px=0;px<=w;px++){const y=mid-Math.sin(ph(px))*A;if(px)x.lineTo(px,y);else x.moveTo(px,y);}x.stroke();
    x.strokeStyle=css("--accent");x.lineWidth=3;x.beginPath();let cap=0;
    for(let px=0;px<=w;px++){const sn=Math.sin(ph(px));let v=m===0?Math.max(0,sn):Math.abs(sn);if(m===2){cap=Math.max(v,cap-0.0035);v=cap;}const y=mid-v*A;if(px)x.lineTo(px,y);else x.moveTo(px,y);}x.stroke();};
  const pick=k=>{m=k;["rcA","rcB","rcC"].forEach((id,i)=>$("#"+id).setAttribute("aria-pressed",i===k));set("rcN",txt[k]);draw();};
  $("#rcA").onclick=()=>pick(0);$("#rcB").onclick=()=>pick(1);$("#rcC").onclick=()=>pick(2);pick(0);
};

function plan(){
  let day=0;
  const stage=(ids,m)=>'<div class="mod"><h3>'+MODS[m]+"</h3>"+ids.map(id=>{const l=L.find(x=>x.id===id);day++;return '<a href="#'+id+'">'+(S.done[id]?"✓ ":"")+"Day "+day+": "+l.t+"</a>";}).join("")+"</div>";
  const road=[
   ["First 30 days: learn the language",["Finish all "+L.length+" lessons and floor missions","Know the plant LOTO procedure by heart","Trace the single line diagram from the incomer to one machine","Shadow at least five breakdowns and log each one"]],
   ["Days 31 to 90: understand one machine fully",["Read one machine's control drawings end to end","Learn the fault codes of the drive type used most in your area","Go online on a PLC with a senior engineer and watch the logic run","Log ten breakdowns with symptom, cause and fix"]],
   ["Months 3 to 12: start owning things",["Take over the preventive maintenance checks for one area","Learn insulation resistance testing and thermal imaging of panels","Write or modify a small PLC routine under supervision","Lead one small improvement: a repeat fault removed or energy saved"]],
   ["Years 1 to 3: choose a direction",["Automation: PLC, HMI, drives and networks","Power systems: HT switchgear, protection relays, substations","Energy management: audits and savings projects. In India, look at the BEE energy manager certification","Reliability: root cause analysis and condition monitoring","Ask about the electrical supervisor competency certificate in your state"]]];
  main.innerHTML='<section class="card"><span class="eyebrow">How to learn this from zero</span><h2 class="lesson-title">My plan</h2>'+
   '<p class="oneline">One lesson each working day, about 20 to 30 minutes, in this order. '+L.length+' working days to a complete industry-level base.</p>'+
   '<ol class="tips"><li><b>Safety before theory.</b> Day 1 is lockout-tagout.</li><li><b>Picture first, formula second.</b> Get the water-pipe idea, then the numbers.</li><li><b>Read, play, watch, quiz.</b> Four short steps in every lesson.</li><li><b>See the real thing the same day.</b> Each lesson has a floor mission.</li><li><b>Review daily.</b> Five old questions a day beats rereading.</li><li><b>Explain it back.</b> If you cannot say it simply, go round again.</li><li><b>Write it down.</b> One notebook for nameplates, faults and questions.</li></ol>'+
   '<div class="btns"><a class="btn primary" style="text-decoration:none" href="#'+((L.find(l=>!S.done[l.id])||L[0]).id)+'">Go to today\'s lesson</a><a class="btn" style="text-decoration:none" href="#review">Daily review</a></div></section>'+
   '<section class="card"><h2>The '+L.length+'-day path</h2><div class="mods">'+ORDER.map(stage).join("")+"</div></section>"+
   '<section class="card"><h2>Floor missions</h2><p class="note">'+L.filter(l=>S.mis[l.id]).length+" of "+L.length+" done. Always with permission, and with a technician where a panel is involved.</p>"+
   L.map((l,i)=>'<label class="check"><input type="checkbox" id="pm-'+l.id+'" data-k="mis:'+l.id+'"'+(S.mis[l.id]?" checked":"")+"><span><b>Day "+(i+1)+".</b> "+F[l.id]+"</span></label>").join("")+"</section>"+
   '<section class="card"><h2>Growing after the course</h2><p class="note">A suggested path. Adjust it with your manager to fit your department.</p>'+
   road.map((r,i)=>"<h3 style=\"font-size:20px;margin-top:6px\">"+r[0]+"</h3>"+r[1].map((t,k)=>'<label class="check"><input type="checkbox" id="rd-'+i+"-"+k+'" data-k="road:r'+i+"-"+k+'"'+(S.road["r"+i+"-"+k]?" checked":"")+"><span>"+t+"</span></label>").join("")).join("")+"</section>";
}

function review(){
  const done=L.filter(l=>S.done[l.id]),src=done.length>=3?done:L;
  const pool=src.flatMap(l=>l.quiz.map(q=>({q,l})));
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
  const set5=pool.slice(0,5),ans=[];
  main.innerHTML='<section class="card"><span class="eyebrow">Retrieval practice</span><h2 class="lesson-title">Daily review</h2>'+
   '<p class="oneline">Five questions drawn from '+(done.length>=3?"the lessons you have finished":"the whole course, until you have finished three lessons")+".</p>"+
   '<div class="outs">'+out("rvS","Review streak")+out("rvD","Days reviewed")+'</div><div id="rv">'+
   set5.map((x,qi)=>'<div class="q"><p>'+(qi+1)+". "+x.q.q+'</p><div class="opts">'+x.q.o.map((o,oi)=>'<button class="opt" data-q="'+qi+'" data-o="'+oi+'">'+o+"</button>").join("")+'</div><div class="why" id="rw'+qi+'"></div></div>').join("")+
   '</div><div class="foot"><span class="note" id="rvM">Each correct answer is worth 5 XP.</span><button class="btn" id="rvN">New set</button></div></section>';
  const stats=()=>{const n=streak();set("rvS",n+(n===1?" day":" days"));set("rvD",S.days.length);};stats();
  $("#rvN").onclick=review;
  main.querySelectorAll("#rv .opt").forEach(b=>b.onclick=()=>{const qi=+b.dataset.q,oi=+b.dataset.o,x=set5[qi];if(ans[qi]!=null)return;ans[qi]=oi===x.q.a;
    main.querySelectorAll('#rv [data-q="'+qi+'"]').forEach(o=>{o.disabled=true;const k=+o.dataset.o;if(k===x.q.a)o.classList.add("right");else if(k===oi)o.classList.add("wrong");});
    $("#rw"+qi).innerHTML=(ans[qi]?"Correct. ":"Not quite. ")+x.q.y+(ans[qi]?"":' <a href="#'+x.l.id+'">Reread: '+x.l.t+"</a>");
    if(ans[qi])S.rx=(S.rx||0)+5;
    if(set5.every((_,k)=>ans[k]!=null)){if(!S.days.includes(today()))S.days.push(today());set("rvM","Done for today: "+ans.filter(Boolean).length+" of "+set5.length+" correct. Come back tomorrow.");stats();}
    save();meter();});
}
main.addEventListener("change",e=>{const c=e.target.closest("input[data-k]");if(!c)return;const p=c.dataset.k.split(":");S[p[0]][p[1]]=c.checked;save();meter();});


const GLOSS=[
["ACB","Air circuit breaker. The large breaker on the main low-voltage incomer."],
["APFC","Automatic power factor correction. A panel that switches capacitor banks in and out."],
["Busbar","A thick copper or aluminium bar that distributes power inside a panel."],
["Contactor","A heavy-duty switch closed by an electromagnet coil. It switches motors on and off."],
["CT","Current transformer. Steps a large current down to a small one for meters and protection relays."],
["DG set","Diesel generator set. Backup power when the grid supply fails."],
["DOL","Direct-on-line. The simplest motor starter: full voltage straight away."],
["Earthing","Bonding metal bodies to earth so a fault trips the protection instead of shocking someone."],
["ELCB / RCCB","Earth leakage or residual current breaker. Trips on a small leakage to earth to protect people."],
["Ferrule","A numbered sleeve on a wire end. The number matches the drawing."],
["FLC","Full load current. The current a motor draws at its rated load, shown on the nameplate."],
["HMI","Human-machine interface. The operator's screen on a machine."],
["HT / LT","High tension and low tension. HT is the kilovolt side, such as 11 kV or 33 kV. LT is the 415 V side."],
["Interlock","A condition that must be true before an action is allowed, such as a guard closed before a press moves."],
["IP rating","How well an enclosure keeps out dust and water, for example IP55."],
["Isolator","A switch used to disconnect a circuit for safe working. It is the point where you fit your lock."],
["kW, kVA, kVAr","Real power, apparent power and reactive power. See the power factor lesson."],
["LOTO","Lockout-tagout. Isolate, lock, tag and test before working on a machine."],
["MCB","Miniature circuit breaker. For small circuits, typically up to about 100 A."],
["MCC","Motor control centre. A panel with a feeder and starter for each motor."],
["MCCB","Moulded case circuit breaker. For larger feeders and motors."],
["Megger","A common name for an insulation resistance tester. Used to check motor windings and cables."],
["NO / NC","Normally open and normally closed. The state of a contact when nothing is energised or pressed."],
["Overload relay","Sits under the contactor and trips it if the motor draws too much current for too long."],
["PCC","Power control centre. The main low-voltage switchboard fed from the transformer."],
["PLC","Programmable logic controller. The industrial computer that runs a machine's logic."],
["PT / VT","Potential or voltage transformer. Steps high voltage down for metering and protection."],
["RTD","Resistance temperature detector, such as a Pt100. Measures temperature by a change in resistance."],
["SLD","Single line diagram. The power map of the plant."],
["SMPS","Switch-mode power supply. The unit that makes 24 V DC for the control circuit."],
["Slip","The small difference between the magnetic field speed and the rotor speed of an induction motor."],
["Thermocouple","A temperature sensor made of two different metals that produce a small voltage when heated."],
["VFD","Variable frequency drive. Controls motor speed by changing the supply frequency."]];
function glossary(){
  main.innerHTML='<section class="card"><span class="eyebrow">'+GLOSS.length+' terms</span><h2 class="lesson-title">Glossary</h2><p class="oneline">The abbreviations and words you will hear on the shop floor.</p>'+
   '<div class="ctrl" style="max-width:420px"><label for="gq">Search</label><input type="search" id="gq" placeholder="Type a term, for example MCC" style="padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)"></div><div class="lab" style="max-width:520px"><b id="gT" style="font-family:var(--mono);font-size:22px"></b><p id="gD"></p><div class="btns"><button class="btn primary" id="gS">Show meaning</button><button class="btn" id="gN">Next term</button></div></div><dl class="gl" id="gl"></dl></section>';
  let cur;const nx=()=>{cur=GLOSS[Math.floor(Math.random()*GLOSS.length)];set("gT",cur[0]);set("gD","Say the meaning to yourself, then check.");};$("#gS").onclick=()=>set("gD",cur[1]);$("#gN").onclick=nx;nx();
  const draw=()=>{const q=$("#gq").value.trim().toLowerCase(),r=GLOSS.filter(g=>!q||(g[0]+" "+g[1]).toLowerCase().includes(q));
    $("#gl").innerHTML=r.length?r.map(g=>"<div><dt>"+g[0]+"</dt><dd>"+g[1]+"</dd></div>").join(""):'<p class="note">No term matches. Try a shorter word.</p>';};
  $("#gq").oninput=draw;draw();
}

let CUR="";
function route(to){
  cancelAnimationFrame(raf);
  const id=(typeof to==="string"&&to)||(location.hash||"#start").slice(1),l=L.find(x=>x.id===id);
  CUR=id;
  if(l)lesson(l);else if(id==="plan")plan();else if(id==="review")review();else if(id==="glossary")glossary();else if(id==="formulas")formulas();else start();
  nav(l?l.id:["plan","review","glossary","formulas"].includes(id)?id:"start");meter();
  window.scrollTo(0,0);
}
/* Navigation does not rely on the browser following #links: some embedded viewers block that.
   Every in-page link is handled here, and the address is updated only if the frame allows it. */
function go(id){route(id);try{if(location.hash!=="#"+id)location.hash=id;}catch(_){}}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute("href").slice(1));});
window.addEventListener("hashchange",()=>{const id=(location.hash||"#start").slice(1);if(id!==CUR)route(id);});
route();
</script>
