<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Floor Electrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a control-panel legend. Lesson rail on the left, one lesson "panel" on the right;
   R-Y-B phase colours are reserved for three-phase content, cobalt is the only accent. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#f4f6f9; --ink:#15202b; --muted:#566473; --line:#d2d9e1;
  --accent:#1d4fd7; --accent-ink:#ffffff; --accent-soft:#e3ebff;
  --good:#15803d; --good-soft:#dcf5e4; --bad:#c0362c; --bad-soft:#fbe3e0; --warn:#a16207; --warn-soft:#fbf0cf;
  --ph-r:#d43d3d; --ph-y:#d39b00; --ph-b:#2f6fe0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f151c; --surface:#18212b; --sunk:#121a23; --ink:#e6ebf1; --muted:#98a5b4; --line:#2b3745;
    --accent:#86a8ff; --accent-ink:#0c1320; --accent-soft:#1d2b4a;
    --good:#5fd08a; --good-soft:#15301f; --bad:#ff8a7e; --bad-soft:#3a1a17; --warn:#f0c14b; --warn-soft:#3a2f10;
    --ph-r:#ff6b6b; --ph-y:#f2c230; --ph-b:#6ea2ff;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f151c; --surface:#18212b; --sunk:#121a23; --ink:#e6ebf1; --muted:#98a5b4; --line:#2b3745;
  --accent:#86a8ff; --accent-ink:#0c1320; --accent-soft:#1d2b4a;
  --good:#5fd08a; --good-soft:#15301f; --bad:#ff8a7e; --bad-soft:#3a1a17; --warn:#f0c14b; --warn-soft:#3a2f10;
  --ph-r:#ff6b6b; --ph-y:#f2c230; --ph-b:#6ea2ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.brand h1{font-size:40px;font-weight:700;text-transform:uppercase}
.brand p{color:var(--muted);font-size:14px}
.phase{display:inline-flex;gap:4px;margin-right:10px;vertical-align:middle}
.phase i{width:10px;height:28px;border-radius:2px;display:block}
.phase i:nth-child(1){background:var(--ph-r)}.phase i:nth-child(2){background:var(--ph-y)}.phase i:nth-child(3){background:var(--ph-b)}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:260px;display:flex;flex-direction:column;gap:6px}
.meter-row{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.meter-row b{color:var(--ink);font-family:var(--mono);font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--sunk);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}

/* layout */
.grid{display:grid;grid-template-columns:270px minmax(0,1fr);gap:18px;align-items:start}
nav.rail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.rail h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 8px 4px;font-weight:600}
.rail a{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:14.5px}
.rail a:hover{background:var(--sunk)}
.rail a.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:10px;line-height:1}
.done .dot{background:var(--good);border-color:var(--good);color:var(--surface)}
.done .dot::after{content:"✓";font-weight:700}
.jump{display:none}
.jump select{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}

main{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.lesson-title{font-size:38px;font-weight:700}
.oneline{font-size:19px;font-weight:500;max-width:60ch}
.card h2{font-size:24px;font-weight:600}
.prose{display:flex;flex-direction:column;gap:10px;max-width:68ch}
.formula{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:10px 12px;font-size:15px;overflow-x:auto}
.plant{background:var(--warn-soft);border:1px solid var(--line);border-radius:8px;padding:12px 14px;max-width:68ch}
.plant b{font-family:var(--display);font-size:17px;letter-spacing:.03em;text-transform:uppercase;display:block;margin-bottom:2px}

/* widget */
.lab{background:var(--sunk);border:1px dashed var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.ctrl{display:flex;flex-direction:column;gap:4px;font-size:14px}
.ctrl label{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.ctrl label b{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent)}
.ctrl select,.ctrl input[type=number]{padding:8px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.out{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.out small{display:block;color:var(--muted);font-size:12.5px}
.out b{font-family:var(--mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.hbar{height:16px;background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
.hbar span{display:block;height:100%;background:var(--accent);transition:width .15s}
.hbar.r span{background:var(--bad)}.hbar.g span{background:var(--good)}
.rowlab{display:flex;justify-content:space-between;font-size:13.5px;color:var(--muted)}
.rowlab b{font-family:var(--mono);color:var(--ink)}
canvas{width:100%;height:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;display:block}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.go{background:var(--good);color:var(--surface);border-color:var(--good)}
.btn.stop{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.rung{font-family:var(--mono);font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;white-space:nowrap}
.rung span{padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.rung span.live{background:var(--good-soft);color:var(--good);border-color:var(--good);font-weight:600}
.rotor{width:74px;height:74px;border-radius:50%;border:5px solid var(--muted);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.steps{display:flex;flex-direction:column;gap:8px}
.steps button{text-align:left}
.steps button.ok{background:var(--good-soft);border-color:var(--good)}
.steps button.no{background:var(--bad-soft);border-color:var(--bad)}
.note{font-size:13.5px;color:var(--muted)}

/* video */
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.video{display:flex;gap:12px;align-items:center;text-decoration:none;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px}
.video:hover{border-color:var(--accent)}
.play{width:46px;height:46px;border-radius:10px;background:var(--bad);flex:none;display:grid;place-items:center}
.play::after{content:"";border-left:14px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent;margin-left:3px}
.video b{display:block;line-height:1.3}
.video small{color:var(--muted)}

/* quiz */
.q{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.q p{font-weight:600;max-width:64ch}
.opts{display:grid;gap:8px}
.opt{text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.why{font-size:14.5px;color:var(--muted);max-width:64ch}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}

.check{display:flex;gap:10px;align-items:flex-start;max-width:68ch;cursor:pointer}
.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--accent);flex:none}
.opt.right,.opt.wrong{opacity:1}
textarea{width:100%;max-width:68ch;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font:inherit;color:inherit;resize:vertical}
.gl{margin:0;display:flex;flex-direction:column}
.gl div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.gl dt{font-family:var(--mono);font-weight:600}.gl dd{margin:0}
@media (max-width:520px){.gl div{grid-template-columns:1fr;gap:2px}}
/* start page */
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mod{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--sunk);display:flex;flex-direction:column;gap:6px}
.mod h3{font-size:20px}
.mod a{font-size:14.5px;text-decoration:none}
.mod a:hover{text-decoration:underline}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:68ch}

@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  nav.rail{display:none}
  .jump{display:block}
  .brand h1{font-size:32px}.lesson-title{font-size:30px}
  .meter{width:100%}
}
@media (prefers-reduced-motion:reduce){.rotor{animation:none}.bar span,.hbar span{transition:none}}

/* ---- Field notebook skin: graph paper by day, chalkboard by night.
   Handwriting marks the learner's side of the page (labels, sticky notes); print type carries the teaching. ---- */
:root{
  --bg:#f1f4ef; --surface:#fcfdfb; --sunk:#eef1eb; --ink:#1c2733; --muted:#55616d; --line:#c7d0d3;
  --accent:#1f5fbf; --accent-ink:#ffffff; --accent-soft:#dfeaf9;
  --good:#1f7a45; --good-soft:#dcf0e2; --bad:#c23b2f; --bad-soft:#f9e1dd; --warn:#8a6500; --warn-soft:#fff3b8;
  --hl:#ffe45c; --note:#fff2ad; --grid:rgba(31,95,191,.07);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1a2521; --surface:#22302b; --sunk:#18221e; --ink:#eef1ea; --muted:#a6b3ab; --line:#3b4b44;
    --accent:#9cc4ff; --accent-ink:#0f1a16; --accent-soft:#273b4c;
    --good:#7fd69c; --good-soft:#1e3a2a; --bad:#ff9a8d; --bad-soft:#42211d; --warn:#f2cf5b; --warn-soft:#3d3515;
    --hl:rgba(242,207,91,.3); --note:#4a4118; --grid:rgba(255,255,255,.045);
  }
}
:root[data-theme="dark"]{
  --bg:#1a2521; --surface:#22302b; --sunk:#18221e; --ink:#eef1ea; --muted:#a6b3ab; --line:#3b4b44;
  --accent:#9cc4ff; --accent-ink:#0f1a16; --accent-soft:#273b4c;
  --good:#7fd69c; --good-soft:#1e3a2a; --bad:#ff9a8d; --bad-soft:#42211d; --warn:#f2cf5b; --warn-soft:#3d3515;
  --hl:rgba(242,207,91,.3); --note:#4a4118; --grid:rgba(255,255,255,.045);
}
body{background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
h1,h2,h3{letter-spacing:-.01em}
.brand h1{text-transform:none;font-size:38px}
.lesson-title{font-size:36px}
.card{position:relative;border-radius:14px 18px 14px 20px;box-shadow:2px 3px 0 rgba(0,0,0,.05)}
.card h2:not(.lesson-title){font-family:var(--hand);font-size:32px;font-weight:700;color:var(--accent);line-height:1}
.eyebrow{font-family:var(--hand);font-size:21px;text-transform:none;letter-spacing:0}
.oneline{width:fit-content;line-height:1.5;background-image:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 90%,transparent 90%);background-size:100% 1.5em}
.plant{background:var(--note);border-color:transparent;border-radius:3px 3px 16px 3px;transform:rotate(-.4deg);box-shadow:2px 4px 0 rgba(0,0,0,.08)}
.plant b{font-family:var(--hand);font-size:25px;text-transform:none;letter-spacing:0;line-height:1.1}
.formula{border:1.5px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--accent-soft)}
.lab{border:2px dashed var(--line);border-radius:18px 12px 20px 12px}
.btn,.opt{border-width:1.5px;border-radius:10px 13px 10px 14px;transition:transform .08s}
.btn:active,.opt:active:not(:disabled){transform:translateY(1px) scale(.99)}
.rail h3{font-family:var(--hand);font-size:20px;text-transform:none;letter-spacing:0}
.meter,nav.rail{border-radius:12px 16px 12px 18px;box-shadow:2px 3px 0 rgba(0,0,0,.05)}
.stamp{position:absolute;top:18px;right:18px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:var(--good);border:3px solid var(--good);border-radius:6px;padding:1px 12px;transform:rotate(-9deg);opacity:.85;animation:stamp .35s ease-out}
.stamp[hidden]{display:none}
@keyframes stamp{from{transform:rotate(-9deg) scale(2.2);opacity:0}}
canvas.tall{height:210px}
canvas.drag{cursor:grab;touch-action:none}
canvas.drag:active{cursor:grabbing}
@media (max-width:820px){.stamp{position:static;align-self:flex-start;transform:rotate(-4deg)}.brand h1{font-size:30px}.lesson-title{font-size:29px}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}.btn,.opt{transition:none}}

/* circuit diagrams and deeper explanations */
figure{margin:0;display:flex;flex-direction:column;gap:8px;overflow-x:auto}
figcaption{font-family:var(--hand);font-size:22px;color:var(--muted);line-height:1.1}
.ckt{width:100%;max-width:560px;min-width:300px;height:auto;display:block}
.ckt .w{stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ckt .f{fill:var(--surface)}
.ckt .thick{stroke-width:4}.ckt .thin{stroke-width:1.3}.ckt .dash{stroke-dasharray:5 5}
.ckt .acc{stroke:var(--accent)}.ckt .live{stroke:var(--good)}.ckt .bad{stroke:var(--bad)}
.ckt .r{stroke:var(--ph-r)}.ckt .y{stroke:var(--ph-y)}.ckt .b{stroke:var(--ph-b)}
.ckt .d{fill:var(--ink)}
.ckt text{fill:var(--ink);font:500 12.5px var(--body)}
.ckt text.m{fill:var(--muted);font-weight:400}.ckt text.bold{font-weight:600;font-size:14px}.ckt text.sm{font-size:10px}
.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.legend div{border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center;font-size:13px;background:var(--surface)}
.legend .ckt{width:72px;min-width:0;height:58px;margin:0 auto}
.ex,.miss{border-radius:8px;padding:12px 14px;max-width:68ch}
.ex{background:var(--accent-soft)}.miss{background:var(--bad-soft)}
.ex b,.miss b{display:block;font-family:var(--hand);font-size:23px;line-height:1.1;margin-bottom:2px}

/* ---- Minimal black: one theme by choice. Black page, hairline borders, white as the only accent.
   Colour is kept for meaning only: good, bad, warning and the R-Y-B phases. ---- */
:root:root:root{
  color-scheme:dark;
  --bg:#000000; --surface:#0a0a0a; --sunk:#111111; --ink:#f2f2f2; --muted:#8f8f8f; --line:#262626;
  --accent:#ffffff; --accent-ink:#000000; --accent-soft:#1c1c1c;
  --good:#4ade80; --good-soft:#0e2216; --bad:#f87171; --bad-soft:#2a1111; --warn:#facc15; --warn-soft:#262008;
  --ph-r:#ff5a5a; --ph-y:#f5c518; --ph-b:#5b9dff;
  --hl:transparent; --note:#111111; --grid:transparent;
  --display:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --hand:var(--body);
}
body{background:var(--bg);background-image:none}
a{color:var(--ink)}
.brand h1{font-size:26px;font-weight:600;letter-spacing:-.02em}
.phase i{width:4px;height:20px;border-radius:1px}
.lesson-title{font-size:30px;font-weight:600;letter-spacing:-.02em}
.card,.meter,nav.rail{border-radius:12px;box-shadow:none}
.card{padding:24px;gap:14px}
.card h2:not(.lesson-title),.rail h3,.plant b,.ex b,.miss b{font-family:var(--body);font-size:12px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.eyebrow{font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.oneline{background-image:none;font-size:20px;font-weight:400;color:var(--ink)}
.prose,.tips{color:#cfcfcf}
.plant{background:transparent;transform:none;box-shadow:none;border:0;border-left:1px solid var(--ink);border-radius:0;padding:2px 0 2px 16px}
.formula{border:1px solid var(--line);box-shadow:none;border-radius:8px;background:var(--bg)}
.lab{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.btn,.opt{border-width:1px;border-radius:8px}
.btn:hover,.opt:hover:not(:disabled),.video:hover{border-color:var(--muted)}
.btn.go,.btn.stop{color:#000}
.rail a.on{background:var(--accent-soft)}
.ex,.miss{background:transparent;border:1px solid var(--line);border-radius:8px}
.miss{border-left:1px solid var(--bad)}
figcaption{font-family:var(--body);font-size:13px}
.video{background:transparent}
.play{background:var(--ink);border-radius:8px}
.play::after{border-left-color:#000}
.stamp{transform:none;animation:none;font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.1em;border-width:1px;border-radius:99px;padding:2px 10px;opacity:1}
.mod,.out,.legend div{background:transparent}
canvas{background:var(--bg)}
.ckt .f{fill:var(--surface)}
textarea,.jump select,.ctrl select,.ctrl input[type=number]{background:var(--bg)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="phase" aria-hidden="true"><i></i><i></i><i></i></span>Shop Floor Electrics</h1>
      <p>Electrical engineering from zero for a Graduate Engineer Trainee at a tyre plant.</p>
    </div>
    <div class="meter" aria-live="polite">
      <div class="meter-row"><span id="rank">New joiner</span><b id="xp">0 XP</b></div>
      <div class="bar"><span id="pbar"></span></div>
      <div class="meter-row"><span>Lessons done</span><b id="pcount">0 / 33</b></div>
    </div>
  </header>

<script>
const MODS=["Before you touch anything","Start from zero","The AC world","Machines and drives","Plant power system","Control and automation","Tools, upkeep and practice"];
const TGT=(()=>{try{return window.self===window.top;}catch(_){return false;}})()?' target="_blank"':"";
const yt=id=>"https://www.youtube.com/watch?v="+id;
const yts=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);

let L=[
{id:"safety-loto",m:0,t:"Safety and lockout-tagout",
 one:"Electricity gives no warning. Isolate, lock, test, and only then touch.",
 body:[
  "You cannot see, hear or smell voltage. A dead panel and a live panel look exactly the same. So engineers never trust a switch position or someone's word. They prove it.",
  "Lockout-tagout (LOTO) is the routine that makes a machine safe to work on. You switch off the isolator, put <b>your own padlock</b> on it, hang a tag with your name, and keep the key in your pocket. Nobody can switch it on while you are inside.",
  "Switching off is only half the job. Machines store energy: compressed air, steam, hydraulic pressure, charged capacitors, a heavy drum still spinning. Release it, then test that the machine really is dead."],
 formula:"Stop → Isolate → Lock and tag → Release stored energy → Test for dead → Work",
 plant:"A curing press holds steam, hot water, hydraulic and pneumatic pressure long after its power is off. A mixer or calender carries huge rotating inertia. Ask for the plant's LOTO procedure on day one and follow it exactly.",
 w:"loto",
 v:[{t:"Lockout Tagout Training Video",c:"YouTube",u:yt("Np14M0du758")}],
 quiz:[
  {q:"A colleague says the panel is switched off. What do you do before touching a terminal?",o:["Trust them, they are senior","Check the switch handle is at OFF","Isolate, lock, and test with a meter yourself"],a:2,y:"Only a test with a working meter proves a circuit is dead. Your lock makes sure it stays that way."},
  {q:"Why does each person fit their own padlock?",o:["So nobody can re-energise while that person is still working","To show who is the supervisor","Because one lock can break"],a:0,y:"The machine can only be switched on when every lock is removed, so every person is protected."}]},

{id:"voltage-current-resistance",m:1,t:"Voltage, current and resistance",
 one:"Voltage pushes, current flows, resistance holds back.",
 body:[
  "Think of water in a pipe. <b>Voltage</b> (volts, V) is the pressure from the pump. <b>Current</b> (amps, A) is how much water flows each second. <b>Resistance</b> (ohms, Ω) is how narrow the pipe is.",
  "More pressure pushes more water. A narrower pipe lets less through. Ohm's law says exactly that with numbers.",
  "Current is what heats cables and trips breakers, so it is the number you will check most often on the shop floor."],
 formula:"V = I × R      I = V ÷ R      R = V ÷ I",
 plant:"Motor nameplates, cable sizes and breaker ratings are all written in amps. A clamp meter reading higher than the nameplate current means the motor is overloaded.",
 w:"ohm",
 v:[{t:"Ohms Law Explained - The basics circuit theory",c:"The Engineering Mindset",u:yt("HsLLq6Rm5tU")}],
 quiz:[
  {q:"A 24 V supply feeds a 12 Ω resistor. What current flows?",o:["0.5 A","2 A","288 A"],a:1,y:"I = V ÷ R = 24 ÷ 12 = 2 A."},
  {q:"Voltage stays the same and resistance doubles. Current will…",o:["double","stay the same","halve"],a:2,y:"Current is inversely proportional to resistance."}]},

{id:"power-and-energy",m:1,t:"Power and energy",
 one:"Power is how fast you use electricity. Energy is how much you used in total.",
 body:[
  "<b>Power</b> is measured in watts (W) or kilowatts (kW). A 75 kW motor needs 75 kW while it runs at full load.",
  "<b>Energy</b> is power multiplied by time, measured in kilowatt-hours (kWh). One kWh is one \"unit\" on the electricity bill.",
  "Power is like the speed of a car and energy is the distance covered. A plant pays for distance, so running hours matter as much as motor size."],
 formula:"P = V × I  (DC)      Energy (kWh) = Power (kW) × Time (h)",
 plant:"Energy is one of the biggest running costs in tyre making. Mixing, curing and compressed air are the heavy users, which is why plants track kWh per tonne of rubber.",
 w:"energy",
 v:[{t:"What is a kWh?",c:"The Engineering Mindset",u:yt("SMPhh8gT_1E")}],
 quiz:[
  {q:"A 10 kW heater runs for 3 hours. Energy used?",o:["3.3 kWh","13 kWh","30 kWh"],a:2,y:"10 kW × 3 h = 30 kWh, or 30 units."},
  {q:"Which is a unit of energy?",o:["kW","kWh","kVA"],a:1,y:"kW is a rate. kWh is the total amount."}]},

{id:"ac-and-dc",m:1,t:"AC and DC",
 one:"DC flows one way. AC swings back and forth 50 times a second.",
 body:[
  "<b>Direct current</b> flows steadily in one direction, like water in a river. Batteries, PLC electronics and sensors use DC, usually 24 V.",
  "<b>Alternating current</b> reverses direction again and again, like a saw blade. In India it completes 50 cycles each second, so the frequency is 50 Hz.",
  "The grid uses AC because transformers can raise and lower AC voltage easily, and high voltage carries power over long distances with little loss."],
 formula:"India: 230 V single-phase, 415 V three-phase, 50 Hz",
 plant:"Inside one control panel you will see both: 415 V AC for the motors and 24 V DC for the PLC, sensors and indicator lamps. Always check which one you are measuring.",
 w:"wave",
 v:[{t:"AC and DC explained",c:"YouTube",u:yts("difference between AC and DC explained animation"),s:1}],
 quiz:[
  {q:"What does 50 Hz mean?",o:["50 volts","50 complete cycles every second","50 amps"],a:1,y:"Hertz counts cycles per second."},
  {q:"A PLC input card and its sensors usually run on…",o:["24 V DC","415 V AC","11 kV AC"],a:0,y:"Low-voltage DC is safe and stable for control electronics."}]},

{id:"three-phase",m:1,t:"Three-phase power",
 one:"Three AC supplies, each a third of a cycle apart, sharing the work.",
 body:[
  "Industry uses three live wires instead of one. They are called R, Y and B (red, yellow, blue). Each carries the same AC wave, shifted by 120°.",
  "Because the three waves peak one after another, the total power never drops to zero. Motors get a smooth push that rotates, so three-phase motors start by themselves.",
  "Between any two phases you measure the <b>line voltage</b>, 415 V. Between one phase and neutral you measure the <b>phase voltage</b>, about 240 V."],
 formula:"V(line) = √3 × V(phase)      P = √3 × V(line) × I × PF",
 plant:"Every busbar and cable in the plant is colour-marked R, Y, B. If two phases are swapped at a motor, it runs backwards. That is the first thing to check after any motor is reconnected.",
 w:"three",
 v:[{t:"How Three Phase Electricity works - The basics explained",c:"The Engineering Mindset",u:yt("4oRT7PoXSS0")}],
 quiz:[
  {q:"The three phases are separated by…",o:["90°","120°","180°"],a:1,y:"360° ÷ 3 = 120°."},
  {q:"A three-phase motor runs in the wrong direction. The quick fix is to…",o:["swap any two phase wires","swap all three wires round","reduce the voltage"],a:0,y:"Swapping any two phases reverses the rotating magnetic field."}]},

{id:"power-factor",m:1,t:"Power factor",
 one:"How much of the current you draw is doing real work.",
 body:[
  "Picture a glass of beer. The liquid is <b>real power</b> (kW), the part that does work. The foam is <b>reactive power</b> (kVAr), which motors need for magnetism but which does no work. The whole glass is <b>apparent power</b> (kVA), what the supply has to deliver.",
  "Power factor is liquid divided by glass. At 1.0 there is no foam. At 0.7 nearly a third of the glass is wasted space.",
  "Low power factor means more current for the same work: hotter cables, bigger transformers, and a penalty on the bill. Capacitor banks supply the foam locally and bring the power factor back up."],
 formula:"PF = kW ÷ kVA      kVA² = kW² + kVAr²",
 plant:"Look for the APFC panel (automatic power factor correction) near the main LT panel. It switches capacitor steps in and out as the motor load changes. Plants aim to keep power factor close to 1.",
 w:"pf",
 v:[{t:"Power Factor Explained - The basics what is power factor pf",c:"The Engineering Mindset",u:yt("Tv_7XWf96gg")}],
 quiz:[
  {q:"A load takes 80 kW and 100 kVA. Power factor?",o:["0.8","1.25","0.2"],a:0,y:"PF = kW ÷ kVA = 80 ÷ 100."},
  {q:"What do plants install to improve a lagging power factor?",o:["More motors","Capacitor banks","Bigger fuses"],a:1,y:"Capacitors supply reactive power close to the load."}]},

{id:"transformers",m:2,t:"Transformers",
 one:"A transformer trades voltage for current using two coils and a shared iron core.",
 body:[
  "AC in the first coil makes a changing magnetic field in the iron core. That field induces a voltage in the second coil. Nothing moves and the coils never touch.",
  "The voltage ratio equals the turns ratio. Fewer turns on the output side gives a lower voltage and a proportionally higher current. Power in is almost equal to power out.",
  "Transformers only work on AC. A steady DC makes a steady field, and a steady field induces nothing."],
 formula:"Vs ÷ Vp = Ns ÷ Np      Vp × Ip ≈ Vs × Is",
 plant:"Power usually arrives at a large plant at 33 kV or 11 kV. Transformers in the substation step it down to 433 V for the shop floor. Small control transformers inside panels step it down again for control circuits.",
 w:"xfmr",
 v:[{t:"How does a Transformer work - Working Principle electrical engineering",c:"The Engineering Mindset",u:yt("UchitHGF4n8")}],
 quiz:[
  {q:"A transformer has 1000 primary turns and 100 secondary turns. 11 kV goes in. What comes out?",o:["110 kV","1.1 kV","11 kV"],a:1,y:"The ratio is 10:1, so 11 000 ÷ 10 = 1100 V."},
  {q:"Why can't a transformer work on steady DC?",o:["DC is too weak","The magnetic field must keep changing to induce a voltage","DC damages copper"],a:1,y:"Induction needs a changing magnetic field."}]},

{id:"induction-motors",m:2,t:"Induction motors",
 one:"A rotating magnetic field drags a metal rotor round with it.",
 body:[
  "Three-phase current in the stator windings creates a magnetic field that spins round the inside of the motor. Its speed is the <b>synchronous speed</b>.",
  "The spinning field induces currents in the bars of the rotor (the \"squirrel cage\"). Those currents make their own magnetism, and the rotor is pulled along.",
  "The rotor always runs slightly slower than the field. That small gap is called <b>slip</b>, and without it nothing would be induced. A 4-pole motor on 50 Hz has a field speed of 1500 rpm and runs at about 1450 to 1480 rpm."],
 formula:"Ns = 120 × f ÷ P      N = Ns × (1 − slip)",
 plant:"Almost everything that moves is driven by an induction motor: mixers, mills, extruders, calenders, conveyors, pumps, fans and compressors. Learn to read a nameplate: kW, volts, amps, rpm, power factor, connection.",
 w:"motor",
 v:[{t:"How Electric Motors Work - 3 phase AC induction motors",c:"The Engineering Mindset",u:yt("59HBoIXzX_c")}],
 quiz:[
  {q:"Synchronous speed of a 6-pole motor on 50 Hz?",o:["3000 rpm","1500 rpm","1000 rpm"],a:2,y:"120 × 50 ÷ 6 = 1000 rpm."},
  {q:"Why does the rotor turn slower than the magnetic field?",o:["Friction only","Slip is needed for current to be induced in the rotor","The supply is weak"],a:1,y:"If the rotor matched the field speed, no current would be induced and there would be no torque."}]},

{id:"motor-starters",m:2,t:"Motor starters",
 one:"A motor at standstill pulls a huge current. Starters tame it.",
 body:[
  "Switch a motor straight onto the supply and it draws about 6 to 8 times its normal current for a few seconds. This is a <b>DOL</b> (direct-on-line) start. Fine for small motors, rough on the supply for big ones.",
  "A <b>star-delta</b> starter connects the windings in star first, so each winding sees a lower voltage. Starting current and torque both drop to about one third. After a few seconds a timer switches to delta for full power.",
  "<b>Soft starters</b> ramp the voltage up electronically, and <b>VFDs</b> (next lesson) ramp the frequency. Both give a smooth start."],
 formula:"DOL start ≈ 6 to 8 × FLC      Star-delta start ≈ ⅓ of DOL",
 plant:"Open a starter panel (with permission) and you will find three contactors and a timer for star-delta: Main, Star and Delta. Listen during a start: you can hear the changeover click.",
 w:"starter",
 v:[{t:"Star Delta Starter Explained - Working Principle",c:"The Engineering Mindset",u:yt("h89TTwlNnpY")}],
 quiz:[
  {q:"Compared with DOL, a star-delta start reduces starting current to about…",o:["one third","one tenth","the same"],a:0,y:"In star each winding gets 1/√3 of the voltage, which makes line current one third."},
  {q:"FLC on a nameplate stands for…",o:["Fault level current","Full load current","Fuse limit current"],a:1,y:"It is the current the motor draws at rated load."}]},

{id:"vfd",m:2,t:"Variable frequency drives",
 one:"Change the frequency and you change the motor speed.",
 body:[
  "Motor speed depends on supply frequency. The grid is fixed at 50 Hz, so a motor on the grid runs at one speed.",
  "A VFD takes the 50 Hz supply, converts it to DC, then rebuilds AC at any frequency you ask for. 25 Hz gives roughly half speed.",
  "For fans and pumps the saving is dramatic. Power needed falls with the cube of speed, so running at 80% speed takes only about half the power."],
 formula:"Speed ∝ frequency      Fan or pump power ∝ speed³",
 plant:"Extruders, calenders and tyre building machines need precise, adjustable speed, so they run on drives. When a line stops with a drive fault, the code on the VFD keypad is your first clue.",
 w:"vfd",
 v:[{t:"Variable Frequency Drives Explained - VFD Basics IGBT inverter",c:"The Engineering Mindset",u:yts("Variable Frequency Drives Explained - VFD Basics IGBT inverter The Engineering Mindset"),s:1},
    {t:"Variable Frequency Drives Explained | VFD Basics - Part 2",c:"RealPars",u:yt("DXjXh0cF8Kc")}],
 quiz:[
  {q:"A 4-pole motor on a VFD set to 25 Hz has a field speed of about…",o:["1500 rpm","750 rpm","375 rpm"],a:1,y:"120 × 25 ÷ 4 = 750 rpm."},
  {q:"A fan is slowed to 80% speed. Power drops to roughly…",o:["80%","64%","51%"],a:2,y:"0.8 × 0.8 × 0.8 = 0.512."}]},

{id:"breakers-and-fuses",m:3,t:"Breakers, fuses and overloads",
 one:"Protection devices cut the supply before a fault burns the cable or the motor.",
 body:[
  "Two things go wrong. An <b>overload</b> is slightly too much current for a long time, like a jammed conveyor. A <b>short circuit</b> is a massive current in an instant, like two wires touching.",
  "A breaker has two trips inside. A bimetal strip heats up and bends on overload (slow). An electromagnet snaps it open on a short circuit (instant). A fuse simply melts.",
  "Sizes go up with current: MCB for small circuits, MCCB for feeders and motors, ACB for the main incomer. A separate overload relay sits under each motor contactor."],
 formula:"MCB < MCCB < ACB      Overload = slow thermal trip, Short circuit = instant magnetic trip",
 plant:"Never just reset a tripped breaker. It tripped for a reason. Find out why first: check the load, the cable and the motor, then reset.",
 w:"breaker",
 v:[{t:"Why Circuit Breakers DON'T Protect People (electric shocks)",c:"The Engineering Mindset",u:yt("gqEu9t8HwW0")}],
 quiz:[
  {q:"A motor's bearing is seizing and it draws 20% extra current. Which protection should act?",o:["Thermal overload","Magnetic short-circuit trip","Lightning arrester"],a:0,y:"A small, sustained excess is an overload, handled by the thermal element."},
  {q:"A breaker trips. First action?",o:["Reset it immediately","Fit a bigger breaker","Find the cause before resetting"],a:2,y:"Resetting onto a fault can cause fire or injury."}]},

{id:"contactors-and-control",m:3,t:"Contactors and control circuits",
 one:"A small switch tells a big switch what to do.",
 body:[
  "A <b>contactor</b> is a heavy-duty switch closed by an electromagnet. Energise its coil with a small current and its main contacts carry the large motor current.",
  "That splits every starter into two circuits. The <b>power circuit</b> carries hundreds of amps to the motor. The <b>control circuit</b> carries a tiny current through push-buttons and the coil.",
  "The classic start-stop circuit uses a spare contact on the contactor to keep its own coil energised after you release Start. This is called <b>latching</b> or holding. Press Stop and the latch drops."],
 formula:"Stop (NC) → Overload (NC) → Start (NO) in parallel with holding contact → Coil",
 plant:"NO means normally open, NC means normally closed. Those two abbreviations appear on every electrical drawing in the plant. Reading control drawings is the single most useful skill for fault-finding.",
 w:"latch",
 v:[{t:"What is a Contactor? How does it work?",c:"YouTube",u:yt("7BkwQrahHv0")}],
 quiz:[
  {q:"Why does the motor keep running after you release the Start button?",o:["The button sticks","A holding contact keeps the coil energised","The motor has a battery"],a:1,y:"The contactor's auxiliary contact bypasses the Start button."},
  {q:"A Stop button is wired normally closed so that…",o:["a broken wire stops the machine","it is cheaper","it uses less power"],a:0,y:"If the wire breaks, the circuit opens and the machine stops. That is fail-safe design."}]},

{id:"earthing",m:3,t:"Earthing",
 one:"Earthing gives fault current an easy path home, so it does not go through you.",
 body:[
  "Every metal body, motor frame, panel and cable tray is bonded to earth with a green or green-yellow conductor.",
  "If a live wire touches the metal body, a large current rushes through the earth wire and trips the breaker or blows the fuse. The body never rises to a dangerous voltage.",
  "Without earthing, the metal body sits live and waits. The first person to touch it becomes the path. <b>Neutral</b> is different: it is the normal return path for current and carries current all the time."],
 formula:"Earth: carries current only during a fault      Neutral: carries current in normal running",
 plant:"Look for two separate earth strips on big motors and transformers. Rubber dust and friction also build static charge on machines and material, so bonding matters for fire safety too.",
 w:null,
 v:[{t:"What is Ground? Earth Ground/Earthing",c:"RimstarOrg",u:yt("zLW_7TPf310")}],
 quiz:[
  {q:"The main purpose of earthing a motor body is to…",o:["save energy","make the motor faster","make a fault trip the protection instead of shocking someone"],a:2,y:"A low-resistance earth path lets fault current flow and operate the protection."},
  {q:"Which conductor carries current during normal operation?",o:["Neutral","Earth","Neither"],a:0,y:"Earth should carry current only during a fault."}]},

{id:"plc-and-sensors",m:3,t:"PLCs and sensors",
 one:"Sensors are the eyes, the PLC is the brain, contactors and valves are the muscles.",
 body:[
  "A <b>PLC</b> (programmable logic controller) is a rugged industrial computer. It reads inputs, runs its program, sets outputs, and repeats many times a second.",
  "<b>Inputs</b> are push-buttons and sensors: proximity sensors detect metal, photoelectric sensors detect objects with light, thermocouples and RTDs measure temperature, transmitters measure pressure.",
  "The program is often drawn as <b>ladder logic</b>, which looks like the relay circuit from the last lesson. Contacts in a row mean AND. Contacts side by side mean OR."],
 formula:"Scan: Read inputs → Run logic → Write outputs → repeat",
 plant:"Curing a tyre is a timed recipe of temperature and pressure, run by a PLC. If an output is not coming on, check the input LEDs on the PLC first. Nine times out of ten a sensor is not giving its signal.",
 w:"plc",
 v:[{t:"PLC Basics | Programmable Logic Controller",c:"RealPars",u:yts("PLC Basics Programmable Logic Controller RealPars"),s:1},
    {t:"Photoelectric Sensor Explained",c:"RealPars",u:yt("l1rjErRvbgw")}],
 quiz:[
  {q:"Two contacts drawn in series on a ladder rung behave as…",o:["OR","AND","NOT"],a:1,y:"Both must be closed for the rung to be true."},
  {q:"Which sensor would you choose to detect a steel part without touching it?",o:["Thermocouple","Inductive proximity sensor","Pressure transmitter"],a:1,y:"Inductive proximity sensors detect metal objects at close range."}]},

{id:"multimeter",m:4,t:"Using a multimeter",
 one:"Your meter is how you see electricity. Learn it before you need it.",
 body:[
  "<b>Voltage</b> is measured across two points, with the circuit live. Select V~ for AC or V⎓ for DC, and start on a range higher than you expect.",
  "<b>Continuity and resistance</b> are measured only on a dead, isolated circuit. The beep tells you a wire or fuse is unbroken.",
  "<b>Current</b> in a plant is measured with a clamp meter around one conductor, never by breaking the circuit. And follow the proving routine: test the meter on a known live source, test your circuit, then test the meter again."],
 formula:"Prove meter → Test circuit → Prove meter again",
 plant:"Use a meter rated CAT III or CAT IV for panel work, with good leads. Clamp one phase at a time: a clamp around a whole three-core cable reads zero.",
 w:null,
 v:[{t:"Learn how to use a multimeter",c:"The Engineering Mindset",u:yt("4lAyzRxsbDc")}],
 quiz:[
  {q:"When may you use the continuity (beep) setting?",o:["Only on a dead, isolated circuit","On any live circuit","Only on DC"],a:0,y:"Resistance and continuity ranges inject their own small current and must never be used on live circuits."},
  {q:"You clamp a meter around a complete three-core motor cable and it reads 0 A. Why?",o:["The motor is off","The three phase currents cancel out","The clamp is broken"],a:1,y:"In a healthy balanced cable the currents sum to zero. Clamp one core at a time."}]}
];


L.push(
{id:"what-is-electricity",t:"What electricity is",
 one:"Electricity is tiny charged particles, called electrons, being pushed along a wire.",
 body:[
  "Everything is made of atoms, and every atom contains electrons. In metals some electrons are loose. They can drift from one atom to the next. Materials like that are <b>conductors</b>. In rubber, plastic or glass the electrons are held tight, so nothing flows. Those are <b>insulators</b>.",
  "A battery or generator works like a pump. It pushes electrons out of one terminal and takes them back at the other. They only flow if there is a complete loop, called a <b>circuit</b>. Break the loop anywhere and the flow stops everywhere. That is all a switch does.",
  "The electrons carry energy from the source to the load. A lamp turns it into light, a heater into heat, a motor into movement."],
 formula:"Source → conductor → load → conductor → back to source   (a complete loop)",
 plant:"Every cable is a conductor (copper or aluminium) wrapped in an insulator (PVC or XLPE). Damaged insulation is one of the most common causes of faults. Tyre rubber is a special case: the carbon black in it makes it slightly conductive, which helps static charge leak away.",
 w:"sorter",
 v:[{t:"How electricity works",c:"The Engineering Mindset",u:yt("mc979OhitAg")}],
 quiz:[
  {q:"What does a switch actually do?",o:["Makes electricity","Breaks or completes the loop","Stores electrons"],a:1,y:"Current flows only in a complete loop. A switch opens or closes that loop."},
  {q:"Which of these is used to insulate cables?",o:["Copper","Aluminium","PVC"],a:2,y:"PVC holds its electrons tightly, so no current passes through it."}]},

{id:"series-and-parallel",t:"Series and parallel circuits",
 one:"In series, components share one path. In parallel, each gets its own.",
 body:[
  "<b>Series</b> means one after another on a single path. The same current flows through every component, and the supply voltage is shared between them. If one breaks, everything stops.",
  "<b>Parallel</b> means side by side, each connected straight across the supply. Every component gets the full voltage and works independently. The currents add up at the source.",
  "This is why adding more machines loads the feeder: each new parallel load draws its own current on top of the others."],
 formula:"Series: R = R1 + R2        Parallel: 1/R = 1/R1 + 1/R2",
 plant:"Loads are connected in parallel so each gets full voltage. Safety devices in a control circuit, such as emergency stops, guard switches and overloads, are wired in series so that any one of them can stop the machine.",
 w:"sp",
 v:[{t:"DC parallel circuits explained - The basics how parallel circuits work",c:"The Engineering Mindset",u:yt("5uyJezQNSHw")}],
 quiz:[
  {q:"Two 10 Ω resistors in series give a total of…",o:["5 Ω","10 Ω","20 Ω"],a:2,y:"Series resistances add: 10 + 10 = 20 Ω."},
  {q:"Why are emergency stop buttons wired in series?",o:["So pressing any one of them breaks the circuit","To save wire","So all must be pressed together"],a:0,y:"In a series chain, one open contact stops the current for everything."}]},

{id:"magnetism-and-induction",t:"Magnetism and induction",
 one:"Current makes magnetism, and changing magnetism makes current. Every motor and transformer runs on this.",
 body:[
  "A wire carrying current has a magnetic field around it. Wind the wire into a coil and you get an <b>electromagnet</b> that you can switch on and off.",
  "It works in reverse too. Move a magnet near a coil and a voltage appears in the coil. This is <b>induction</b>. It only happens while the magnetic field is changing. Hold the magnet still and you get nothing.",
  "Third idea: a wire carrying current inside a magnetic field feels a push. Arrange that push in a circle and you have a motor."],
 formula:"Induced voltage ∝ number of turns × how fast the magnetic field changes",
 plant:"Contactor coils, solenoid valves and brakes are electromagnets. Generators, transformers and motors all use induction. Learn this one idea well and the whole Machines stage becomes easy.",
 w:"induce",
 v:[{t:"How does an Electric Motor work? (DC Motor)",c:"YouTube",u:yt("CWulQ1ZSE3c")}],
 quiz:[
  {q:"A magnet sits perfectly still inside a coil. The induced voltage is…",o:["zero","maximum","equal to the supply"],a:0,y:"Induction needs a changing magnetic field. No change, no voltage."},
  {q:"Which of these is an electromagnet at work?",o:["A fuse","A contactor coil","A cable lug"],a:1,y:"Energising the coil creates a magnetic field that pulls the contacts closed."}]},

{id:"reading-drawings",t:"Reading electrical drawings",
 one:"Drawings are the map of the plant. Learn the symbols and you can find any fault.",
 body:[
  "A <b>single line diagram</b> (SLD) shows how power reaches every machine. One line stands for all three phases. Follow it from the incoming supply through transformers and panels down to a motor.",
  "A <b>control drawing</b> shows how one machine is controlled. It is drawn as rungs between two supply lines. Read it left to right, top to bottom, like a page.",
  "Every device has a tag such as Q1, K3 or M2. The same tag appears on the drawing, on the device label and on the wire ferrules, so you can go from paper to panel. Contacts are always drawn in their resting state, with no power applied."],
 formula:"Q = breaker or isolator   K = contactor or relay   F = fuse or overload   S = switch or push-button   M = motor   T = transformer",
 plant:"Every machine has a drawing set, usually in the panel door pocket or with the maintenance office. Pick one small machine and trace its motor circuit from the breaker to the motor terminals.",
 w:"sld",
 v:[{t:"How to read a single line diagram",c:"YouTube",u:yts("how to read electrical single line diagram for beginners"),s:1}],
 quiz:[
  {q:"A single line diagram shows…",o:["the PLC program","how power flows from the source to the loads","cable tray routes"],a:1,y:"It is the power map of the plant, simplified to one line per circuit."},
  {q:"On a drawing, contacts are shown…",o:["as they are when the machine runs","in their resting, de-energised state","in whichever way is neater"],a:1,y:"That convention lets you work out what changes when each coil is energised."}]},

{id:"fault-finding",t:"Fault-finding method",
 one:"Do not guess. Follow the energy from the source to the load until you find where it stops.",
 body:[
  "<b>Ask and look first.</b> What was the machine doing? Any alarm, smell, noise or lamp? What changed since it last worked?",
  "<b>Check the simple things.</b> Emergency stop pressed, breaker tripped, overload tripped, guard open, sensor knocked out of position.",
  "<b>Then measure in order.</b> Decide whether the fault is in the power circuit or the control circuit. Does the contactor pull in? Check voltage point by point until it disappears. Fix the cause, not the symptom, and write it down."],
 formula:"Ask → Look → Check the simple things → Measure in order → Fix the cause → Record",
 plant:"Most breakdowns are simple: a tripped overload, a pressed emergency stop, a misaligned sensor, a loose wire. Experienced technicians check those first. Keep a log, because repeat faults point to the real root cause.",
 w:"fault",
 v:[{t:"PLC Troubleshooting 101: Basic Tips and Tricks",c:"RealPars",u:yts("PLC Troubleshooting 101 Basic Tips and Tricks RealPars"),s:1}],
 quiz:[
  {q:"A machine has stopped. Your first step is to…",o:["start replacing parts","ask the operator what happened and look at the alarms","reset everything"],a:1,y:"Two minutes of asking and looking often saves an hour of measuring."},
  {q:"An overload relay keeps tripping. The right response is to…",o:["turn its setting up","bypass it","find out why the motor draws too much current"],a:2,y:"The relay is reporting a real problem: a jam, a bad bearing, low voltage or a failing motor."}]}
);

const ys=(t,q)=>({t,c:"YouTube",u:yts(q),s:1});
L.push(
{id:"capacitors-and-inductors",t:"Capacitors, inductors and impedance",
 one:"Resistors turn energy into heat. Capacitors and inductors store it and hand it back, and that shifts the current in time.",
 body:["A <b>capacitor</b> is two plates with insulation between them. It stores energy as electric charge. It blocks steady DC but lets AC through, more easily as the frequency rises.",
  "An <b>inductor</b> is a coil. It stores energy in its magnetic field and resists any change in current. It passes DC easily and opposes AC, more strongly as the frequency rises.",
  "Their opposition to AC is called <b>reactance</b>, measured in ohms like resistance. Resistance and reactance together make <b>impedance</b> (Z). In an inductor the current lags the voltage. In a capacitor it leads. That time shift is where power factor comes from."],
 formula:"XL = 2πfL      XC = 1 ÷ (2πfC)      Z = √(R² + X²)",
 plant:"Motors, transformers and solenoids are inductive. Capacitors sit in APFC panels, single-phase motors, drive DC buses and power supplies. A capacitor can hold a dangerous charge after power-off: wait, discharge and test before touching.",
 w:"react",v:[ys("Capacitors Explained - The basics how capacitors work","Capacitors Explained The basics how capacitors work The Engineering Mindset"),ys("Inductors Explained - The basics how inductors work","Inductors Explained The basics how inductors work working principle The Engineering Mindset")],
 quiz:[{q:"As frequency rises, the reactance of an inductor…",o:["rises","falls","stays the same"],a:0,y:"XL = 2πfL, so it is proportional to frequency."},
  {q:"You have isolated a capacitor bank. Before touching it you…",o:["start work at once","wait the discharge time and test for voltage","switch it back on briefly"],a:1,y:"Capacitors store charge after the supply is removed."}]},

{id:"other-motors-and-generators",t:"Other motors and generators",
 one:"The induction motor is the workhorse, but you will meet several other machines.",
 body:["<b>DC motors</b> use brushes and a commutator. Their speed is easy to control, so older lines used them. Brushes wear and need attention, and AC motors with drives have replaced most of them.",
  "<b>Synchronous motors</b> turn at exactly the field speed with no slip. <b>Servo motors</b> are permanent-magnet synchronous motors with an encoder that reports position, run by a servo drive for precise moves. <b>Single-phase motors</b> need a capacitor to start and drive small fans and pumps.",
  "A <b>generator</b> (alternator) is the motor idea in reverse. An engine spins a magnetised rotor inside stator windings and a voltage is induced. Engine speed sets the frequency. The field current, controlled by the AVR, sets the voltage."],
 formula:"Generator frequency: f = P × N ÷ 120      (4 poles at 1500 rpm gives 50 Hz)",
 plant:"Tyre building machines use servo axes for accurate positioning. Some older mixers or calenders may still have large DC motors. The DG set in the powerhouse is an alternator driven by a diesel engine.",
 w:null,v:[ys("Servo Motor Explained","Servo Motor Explained The Engineering Mindset"),ys("AC Electrical Generator Basics - How electricity is generated","AC Electrical Generator Basics How Electricity is Generated The Engineering Mindset")],
 quiz:[{q:"A 4-pole DG alternator must run at what speed for 50 Hz?",o:["3000 rpm","1500 rpm","750 rpm"],a:1,y:"N = 120 × 50 ÷ 4 = 1500 rpm."},
  {q:"Which motor uses an encoder to report its exact position?",o:["Servo motor","Single-phase fan motor","Squirrel-cage induction motor on DOL"],a:0,y:"The servo drive uses that feedback to correct the position continuously."}]},

{id:"power-electronics",t:"Power electronics",
 one:"Electronic switches with no moving parts that convert power from one form to another.",
 body:["A <b>diode</b> is a one-way valve for current. Four or six of them make a <b>rectifier</b>, which turns AC into DC.",
  "A <b>thyristor</b> (SCR) is a diode you switch on with a small gate pulse. It is used in soft starters and heater controls. An <b>IGBT</b> is a fast switch that turns on and off thousands of times a second. It is the heart of every drive and inverter.",
  "From these you can build every conversion: AC to DC (rectifier, power supply), DC to AC (inverter, UPS), AC to AC at another frequency (VFD) and DC to DC."],
 formula:"Rectifier: AC → DC      Inverter: DC → AC      VFD: AC → DC → AC      SMPS: AC → 24 V DC",
 plant:"The 24 V power supply, every drive, every UPS, soft starters, battery chargers and LED lights are power electronics. They are efficient but dislike heat and dust: keep panel filters clean and cooling fans running.",
 w:"rect",v:[{t:"How Inverters Work - Working principle rectifier",c:"The Engineering Mindset",u:yt("ln9VZIL8rVs")}],
 quiz:[{q:"Which circuit converts AC to DC?",o:["Inverter","Rectifier","Transformer"],a:1,y:"A rectifier uses diodes to let current pass in one direction only."},
  {q:"What shortens the life of drives and power supplies most?",o:["Heat and dust","Low humidity","Running at rated load"],a:0,y:"Blocked filters and failed fans let heat build up in the semiconductors and capacitors."}]},

{id:"plant-power-distribution",t:"Plant power distribution",
 one:"Power enters at high voltage in one place and fans out in steps to every machine.",
 body:["The utility supplies a large plant at high voltage, 33 kV or more. In the <b>substation</b>, HT breakers and transformers bring it down to 433 V.",
  "From the transformer, power goes to the main LT board (<b>PCC</b>), then to <b>MCCs</b> and distribution boards near the machines. At each step the breakers get smaller.",
  "<b>DG sets</b> take over if the grid fails, after a short start-up delay. A <b>UPS</b> with batteries covers that gap for loads that must not blink: PLCs, servers and critical controls."],
 formula:"Grid → HT breaker → Transformer → PCC → MCC → Starter → Motor",
 plant:"A power loss in the middle of a cure or a mix can scrap the product, so tyre plants take backup power seriously. Learn which loads in your area are on the DG and which are on UPS.",
 w:"outage",v:[ys("How do Substations Work?","How do substations work The Engineering Mindset")],
 quiz:[{q:"What keeps a PLC running in the seconds before the DG starts?",o:["The APFC panel","The UPS","The transformer"],a:1,y:"UPS batteries supply the load with no break."},
  {q:"PCC stands for…",o:["Power control centre","Primary cable connection","Phase current controller"],a:0,y:"It is the main low-voltage switchboard fed from the transformer."}]},

{id:"cables-and-terminations",t:"Cables and terminations",
 one:"A cable is chosen for the current it carries, the distance it runs and the place it runs through.",
 body:["Every cable has a <b>current rating</b>, set by how hot its insulation may get. Thicker conductors carry more. The rating falls when cables are bunched together or pass through hot areas, so they are derated.",
  "Every cable also has resistance, so some voltage is lost along it. This is <b>voltage drop</b>. A long run needs a thicker cable than the current alone suggests.",
  "Most cable faults happen at the ends. A <b>lug</b> crimped with the right tool, a <b>gland</b> that grips and seals the cable, and correctly tightened terminals matter more than the cable itself."],
 formula:"Three-phase voltage drop ≈ √3 × I × R (Ω per km) × length (km)",
 plant:"Power cables are aluminium or copper with XLPE or PVC insulation, often armoured. Control cables are multi-core copper with numbered cores. Flexible cables on moving machine parts fail from fatigue: suspect them first on an intermittent fault.",
 w:"vdrop",v:[ys("Cable sizing and voltage drop explained","cable size calculation voltage drop explained for beginners")],
 quiz:[{q:"Why might a long run need a thicker cable than the current rating requires?",o:["To limit voltage drop","To look neater","To raise the power factor"],a:0,y:"Resistance rises with length, so the voltage lost along the cable rises too."},
  {q:"A slightly loose terminal carrying a heavy current will…",o:["save energy","heat up","trip the PLC"],a:1,y:"Extra contact resistance turns into heat: P = I² × R."}]},

{id:"switchgear-and-protection-relays",t:"Switchgear and protection relays",
 one:"At high currents and voltages, a separate relay does the thinking and tells the breaker when to open.",
 body:["Large currents cannot go straight into instruments. A <b>current transformer</b> (CT) scales the current down, for example 800 A to 5 A. A <b>voltage transformer</b> (PT or VT) scales high voltage down to 110 V. Meters and relays work from these small signals.",
  "A <b>protection relay</b> watches those signals. If the current is too high for too long (overcurrent), or current is leaking to earth (earth fault), it energises the breaker's trip coil.",
  "The breaker does the heavy work of breaking the arc. On HT systems this is usually a <b>VCB</b>, a vacuum circuit breaker. On the main LT board it is an <b>ACB</b>."],
 formula:"CT ratio 800/5: 800 A in the busbar gives 5 A to the relay",
 plant:"Relay settings are calculated so that the breaker nearest the fault trips first. They are not adjusted on the shop floor. If a relay has tripped, record its indication or fault record before anyone resets it.",
 w:"ct",v:[ys("Overcurrent protection relay explained","overcurrent protection relay working principle explained CT")],
 quiz:[{q:"Why must the secondary of a live CT never be left open?",o:["The meter reads low","A dangerously high voltage develops across it","The CT loses its ratio"],a:1,y:"A CT forces its secondary current to flow. With no path, the voltage rises to a dangerous level."},
  {q:"A protection relay has tripped a feeder. Your first action is to…",o:["reset it quickly","record what the relay indicates","raise its setting"],a:1,y:"The indication is the evidence of what kind of fault occurred."}]},

{id:"power-quality",t:"Power quality",
 one:"Clean power is a steady, balanced sine wave. Real plant power is rarely that clean.",
 body:["<b>Voltage dips</b> are short drops, often when a large motor starts or a fault happens somewhere on the grid. They can trip drives and reset controllers.",
  "<b>Harmonics</b> are distortions of the sine wave caused by drives, rectifiers and other electronic loads. They overheat transformers, cables and capacitors.",
  "<b>Unbalance</b> means the three phase voltages are not equal. A small voltage unbalance causes a much larger current unbalance in motors, and extra heating."],
 formula:"THD = total harmonic distortion in %      5th harmonic = 250 Hz, 7th = 350 Hz",
 plant:"A plant full of drives has harmonics. Signs: capacitor banks that fail often, transformers that run hot and hum, nuisance trips with no clear cause. The cures are line reactors, harmonic filters and detuned capacitor banks.",
 w:"harm",v:[ys("Harmonics in power systems explained","harmonics in electrical power system explained simply")],
 quiz:[{q:"The main source of harmonics in a plant is…",o:["drives and rectifiers","heaters","earthing"],a:0,y:"They draw current in pulses instead of a smooth sine wave."},
  {q:"On a 50 Hz system the 5th harmonic is at…",o:["55 Hz","250 Hz","500 Hz"],a:1,y:"5 × 50 = 250 Hz."}]},

{id:"machine-safety-circuits",t:"Machine safety circuits",
 one:"Safety circuits are built so that any failure stops the machine and never starts it.",
 body:["An <b>emergency stop</b> is a latching, normally closed button. Pressing it and cutting its wire both open the circuit. <b>Guard switches</b> and <b>light curtains</b> do the same when a guard opens or a beam is broken.",
  "A <b>safety relay</b> or safety PLC monitors these devices through two separate channels. If the channels disagree, or a wire shorts, it refuses to reset.",
  "The safety relay then drops out <b>two contactors in series</b>, so the motor stops even if one contactor has welded shut. It checks that both have dropped before it allows a restart."],
 formula:"Two channels in → safety relay → two contactors out, with feedback",
 plant:"Tyre machines have nip points, presses and heavy moving parts, so they carry many safety devices. Never bridge, tape or bypass one, even 'just to test'. A bypassed safety device is behind many serious injuries.",
 w:null,v:[ys("Safety relay explained","safety relay working principle explained emergency stop dual channel")],
 quiz:[{q:"Why does a safety circuit use two contactors in series?",o:["To share the current","So the motor still stops if one has welded","To start more smoothly"],a:1,y:"Redundancy: one failure cannot remove the protection."},
  {q:"Emergency stop contacts are wired…",o:["normally closed","normally open","either way"],a:0,y:"A broken wire then stops the machine, which is the safe direction to fail."}]},

{id:"instrumentation-and-control-loops",t:"Instrumentation and control loops",
 one:"Measure, compare, correct. That loop holds temperature, pressure and speed where they should be.",
 body:["A <b>transmitter</b> measures something physical, such as temperature, pressure, level or flow, and sends it as a standard signal, usually 4 to 20 mA.",
  "A <b>controller</b> compares that measurement (the process value) with the target (the setpoint). The difference is the error.",
  "The controller adjusts a <b>final element</b>, such as a control valve, heater or drive speed, to shrink the error. Most use the <b>PID</b> method: P reacts to the error now, I to error that has persisted, D to how fast it is changing."],
 formula:"Value = Low + (mA − 4) ÷ 16 × (High − Low)",
 plant:"Curing a tyre means holding temperature and pressure to a recipe for a set time. Those are control loops with RTDs or thermocouples, pressure transmitters and control valves. A sticky valve or a drifting sensor shows up as product variation long before it shows up as a breakdown.",
 w:"ma",v:[ys("PID Controller Explained","PID Controller Explained RealPars")],
 quiz:[{q:"A 4 to 20 mA transmitter is sending 0 mA. That means…",o:["the reading is zero","a broken wire or a failed transmitter","the reading is at maximum"],a:1,y:"The lowest valid signal is 4 mA. Zero means the loop is broken."},
  {q:"In PID control, the I (integral) term…",o:["removes an error that persists","reacts to sudden change","sets the alarm limits"],a:0,y:"It keeps adding correction for as long as an error remains."}]},

{id:"hmi-scada-and-networks",t:"HMI, SCADA and industrial networks",
 one:"Networks let machines, drives and people share data along one cable instead of hundreds of wires.",
 body:["An <b>HMI</b> is the operator's touch screen on a machine. <b>SCADA</b> is software that gathers data from many machines for a control room: live values, alarms, trends and reports.",
  "Devices talk over industrial networks. Common names are <b>Modbus</b>, <b>Profibus</b>, <b>Profinet</b> and <b>EtherNet/IP</b>. Every device has an address, and one wrong or duplicated address stops communication.",
  "With <b>remote I/O</b>, sensors are wired to a small station near the machine and one network cable carries everything to the PLC."],
 formula:"Field devices → remote I/O → PLC → HMI and SCADA → plant systems",
 plant:"Alarm history and trends are your best fault-finding tools. Before opening a panel, read what the HMI says happened, in what order and at what time. A 'bus fault' usually means a cable, connector, address or power problem at one station.",
 w:null,v:[ys("What is SCADA?","What is SCADA RealPars")],
 quiz:[{q:"A line has stopped. The best first source of information is…",o:["the HMI alarm history","the motor nameplate","the energy meter"],a:0,y:"It records what happened, in order, with times."},
  {q:"Two devices on a network are given the same address. The result is…",o:["faster communication","a communication fault","nothing"],a:1,y:"Every device needs a unique address."}]},

{id:"maintenance-and-testing",t:"Maintenance and testing",
 one:"Most electrical failures give warning: heat, noise, vibration, falling insulation. Maintenance is the habit of looking for it.",
 body:["<b>Preventive</b> maintenance is done on a schedule: clean, tighten, inspect, lubricate. <b>Condition-based</b> maintenance measures the machine's health and acts when a trend turns bad.",
  "The key tests are <b>insulation resistance</b> of windings and cables, <b>thermal imaging</b> of live panels to find hot joints, <b>vibration</b> and bearing checks on motors, and current on all three phases.",
  "A motor's enemies are heat, dirt, moisture and bad bearings. Keep the cooling fins clean, check that the fan and its cover are intact, and grease bearings by the maker's schedule."],
 formula:"PI (polarisation index) = insulation resistance at 10 min ÷ at 1 min",
 plant:"Carbon black and rubber dust get everywhere. They block motor cooling fins and panel filters and can form conductive deposits. Here, cleaning is electrical maintenance.",
 w:"pi",v:[ys("Insulation resistance testing of motors explained","insulation resistance test megger motor testing explained")],
 quiz:[{q:"Thermal imaging of a live panel is used to find…",o:["loose, high-resistance joints","wrong cable colours","PLC program errors"],a:0,y:"A poor joint runs hotter than its neighbours and shows clearly on the image."},
  {q:"Before an insulation resistance test on a motor fed by a drive you must…",o:["leave the drive connected","isolate, lock out and disconnect the drive","run the motor warm"],a:1,y:"The test voltage will destroy the drive's electronics."}]},

{id:"energy-and-efficiency",t:"Energy and efficiency",
 one:"The cheapest unit of electricity is the one you do not use.",
 body:["The bill has two main parts: <b>energy</b>, the kWh used, and <b>maximum demand</b>, the highest kVA drawn in any billing interval. Lowering the peak saves money even when total energy stays the same.",
  "Motors use most of a plant's electricity. Savings come from switching off idle machines, sizing motors correctly, <b>high-efficiency motors</b> (IE3 and above) and drives on fans and pumps.",
  "<b>Compressed air</b> is one of the most expensive utilities, because most of the electricity fed to a compressor ends up as heat. Leaks, excess pressure and using air for cleaning waste a great deal."],
 formula:"Saving (kW) = Output kW × (1 ÷ old efficiency − 1 ÷ new efficiency)",
 plant:"Tyre plants are energy-intensive, with steam for curing, large mixers and a lot of compressed air. Energy projects are a visible way for a young engineer to contribute. Start by measuring what your area uses per shift and what runs when nothing is being made.",
 w:"eff",v:[ys("Energy efficient motors IE3 explained","energy efficient motors IE3 explained savings")],
 quiz:[{q:"The maximum demand charge depends on…",o:["total kWh in the month","the highest kVA drawn in any billing interval","the number of motors"],a:1,y:"One short peak can set the charge for the whole month."},
  {q:"The best first step to cut compressed air cost is to…",o:["buy a bigger compressor","find and fix leaks","raise the pressure"],a:1,y:"Leaks waste air all day, every day."}]},

{id:"standards-and-permits",t:"Standards, permits and hazardous areas",
 one:"The rules were written from past accidents. Know which ones apply before you do the job.",
 body:["Electrical work in India is governed by safety regulations made under the Electricity Act by the Central Electricity Authority, and by Indian Standards (IS), many of them aligned with international IEC standards. Your plant turns these into its own procedures.",
  "A <b>permit to work</b> is written permission for a risky job: HT switching, work at height, hot work, confined spaces. It states the isolation, the precautions and who is responsible. No permit, no job.",
  "<b>PPE</b> is the last layer: insulated gloves, safety shoes, a face shield and arc-rated clothing for switching. Where flammable vapour or dust may be present, equipment must be specially certified (flameproof, Ex-rated) so that it cannot ignite the atmosphere."],
 formula:"Eliminate → Isolate → Engineer → Procedure → PPE     (most effective first)",
 plant:"Solvent and cement areas and fine carbon black dust can create flammable atmospheres, so parts of a tyre plant are classed as hazardous areas. Never take an ordinary tool, lamp or phone into one, and never replace Ex equipment with a standard part.",
 w:null,v:[ys("Permit to work system explained","permit to work system electrical safety explained")],
 quiz:[{q:"In the order of safety controls, PPE is…",o:["the first choice","the last line of defence","not needed if you are careful"],a:1,y:"It only limits injury when every other control has failed."},
  {q:"A light fitting fails in a hazardous area. You replace it with…",o:["any fitting of the same wattage","the same Ex-certified type","an LED strip"],a:1,y:"Only certified equipment is safe in a flammable atmosphere."}]}
);

/* ---------- circuit diagrams (IEC-style symbols) ---------- */
const P_=(d,c="w")=>`<path class="${c}" d="${d}"/>`;
const T_=(x,y,t,a="start",c="")=>`<text x="${x}" y="${y}" text-anchor="${a}" class="${c}">${t}</text>`;
const C_=(x,y,r,c="w f")=>`<circle class="${c}" cx="${x}" cy="${y}" r="${r}"/>`;
const R_=(x,y,w,h,c="w f")=>`<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const dot=(x,y)=>`<circle class="d" cx="${x}" cy="${y}" r="3.2"/>`;
const SV=(w,h,label,inner)=>`<svg class="ckt" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${inner}</svg>`;
const cell=(x,y)=>P_(`M${x-12} ${y-6}H${x+12}`)+P_(`M${x-6} ${y+6}H${x+6}`,"w thick")+T_(x+16,y-8,"+");
const lampS=(x,y)=>C_(x,y,12)+P_(`M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}`);
const meterS=(x,y,l)=>C_(x,y,13)+T_(x,y+5,l,"middle","bold");
const motorS=(x,y)=>C_(x,y,20)+T_(x,y+2,"M","middle","bold")+T_(x,y+14,"3~","middle","sm");
const noV=(x,y)=>P_(`M${x} ${y+12}L${x-11} ${y-10}`);
const ncV=(x,y)=>P_(`M${x} ${y+12}L${x+9} ${y-13}M${x} ${y-12}H${x+11}`);
const pbS=(x,y)=>P_(`M${x-6} ${y}H${x-20}M${x-20} ${y-6}V${y+6}`,"w thin");
const coilS=(x,y)=>R_(x-14,y-9,28,18);
const earthS=(x,y)=>P_(`M${x-10} ${y}H${x+10}M${x-6} ${y+4}H${x+6}M${x-2} ${y+8}H${x+2}`);
const xS=(x,y)=>P_(`M${x-4} ${y-4}L${x+4} ${y+4}M${x+4} ${y-4}L${x-4} ${y+4}`);
const mini=(inner,name)=>"<div>"+SV(90,70,name,inner)+name+"</div>";

const D={
"safety-loto":{cap:"Where the lock goes",svg:SV(520,120,"Supply, locked isolator, contactor and motor",
  T_(8,54,"415 V")+P_("M50 50H170")+P_("M170 50L197 34")+P_("M200 50H280")+P_("M280 50L307 38")+P_("M310 50H400")+motorS(420,50)+dot(170,50)+dot(200,50)+dot(280,50)+dot(310,50)+
